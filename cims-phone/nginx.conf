# CIMS Phone (MCPTT UE) - nginx configuration
# Serves React static build and proxies MCPTT API + WebSocket calls
# Install: copy to /etc/nginx/sites-available/cims-phone

server {
    listen 3000;
    server_name _;

    root /opt/cims/phone/dist;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MCPTT server proxy (IdMS/GMS/CMS/KMS) → CSC MCPTT server (port 4430)
    location /mcptt {
        proxy_pass https://127.0.0.1:4430;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebRTC gateway WebSocket proxy → cwrtc (port 8080)
    location /cwrtc {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
