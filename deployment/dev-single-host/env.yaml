# dev-single-host 환경 — 로컬 1-node (개발자 워크스테이션)
#
# 단일 host 의 loopback 위에 csc/csp/cmp 동거.
# 사용 예: 개발자가 변경 사항을 빠르게 smoke 돌릴 때.
#
# 셋업: 별도 스크립트 없음 — 그냥 build/dist/ 에서 직접 실행 가능

name:        dev-single-host
description: 단일 host loopback (csc/csp/cmp 동거) — 빠른 smoke 용
kind:        single-host

csc:
  url:   https://127.0.0.1:4419
  notes: 같은 host 의 TB-CSC

database: null     # 외부 DB 미연결 — file fallback

service_logging:
  dir:            /tmp/cims-dev/service_log
  enable:         [sip, cmp, csc]
  enable_for_cmp: [csp]
  recording:      false

networks:
  - id:      loopback
    cidr:    127.0.0.0/8
    purpose: 모든 트래픽 (single host)

nodes:
  - id:        self
    agent_id:  1
    role_hint: all-in-one
    nics:
      - { iface: lo, net: loopback, ip: 127.0.0.1, mask: 8 }

ha_groups:
  - id:      1
    name:    Standalone
    mode:    standalone
    members:
      - { node: self, role: master, priority: 100 }
    vips: []   # standalone — VIP 없음
