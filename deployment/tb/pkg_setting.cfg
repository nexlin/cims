# =============================================================
# pkg_setting.cfg — 모듈 배포 설정값 (45 단계가 이 파일을 읽는다)
#
# **여기 적힌 값이 그대로 들어간다.** 바꾸고 싶으면 이 파일만 고친 뒤
# 45 단계를 다시 돌린다:
#
#     vi pkg_setting.cfg
#     sudo ./tb-install.sh --role config
#
# 아래 값은 개발 서버(ctrl02) 실측 통과분이다. TB 장비에 맞게 고쳐 쓴다 —
# 특히 주소 3개(SIP/RTP/관리)와 도메인 2개는 사이트마다 다르다.
#
# ── 줄 형식 ───────────────────────────────────────────────────
#   <모듈> <키>=<값>              배포 overlay (콘솔 [패키지 설정] 과 같은 자리)
#   <모듈>/<컬렉션> <JSON 객체>   컬렉션 레코드 — 한 줄이 한 행, 적은 순서가 저장 순서
#   [vars]                        이 파일 안에서만 쓰는 값 (아래 줄들이 ${이름} 으로 참조)
#   # …                           주석. 빈 줄 무시
#
# 값의 타입은 생김새로 정해진다 — false/true·숫자·[...]·{...} 는 그 타입,
# 나머지는 문자열. (콘솔 저장과 같은 규칙)
#
# ── 참조로 남긴 것 넷 (리터럴로 박지 않는 이유가 있다) ────────
#   ${TB_DB_APP_PASS}  DB 비밀번호. 이 파일은 반입본 tar 에 실려 나가므로 적어두면
#                      tar 를 여는 누구나 본다. tb-site.conf(0600) 에 둔다.
#   ${STORE}           관리 store   = <설치경로>/modules/oam/runtime
#   ${SVCLOG}          서비스 로그  = <STORE>/service_log
#   ${CSP_CERT}        TLS 인증서   = <STORE>/cert/csp-site.pem
#                      **사이트마다 45 단계가 만든다**(없을 때만, 0600, SAN 포함).
#                      버전 디렉토리 밖이라 패키지 업그레이드에 지워지지 않는다.
#   ${CSP_CERT_BUNDLED}  반입본 동봉본 = <설치경로>/modules/csp/current/csp/cert/csp.pem
#                      레포에 커밋된 **전 배치 공용 키**이고 SAN 이 없다(단말이 신원
#                      검증을 켜면 반드시 실패). 굳이 쓰려면 아래 tls_cert_path 를
#                      이 이름으로 바꾼다 — 권하지 않는다.
#                      위 넷은 설치 경로에서 기계적으로 유도된다. 리터럴로 박으면
#                      설치 경로를 바꿀 때 조용히 어긋난다.
#   tb-site.conf 의 다른 TB_* 도 ${이름} 으로 쓸 수 있다. 없거나 비면 줄 번호를
#   짚어 중단한다 — 조용히 빈 값이 들어가는 쪽이 훨씬 비싸다.
#
# ── 알아둘 규칙 ───────────────────────────────────────────────
#   · **모듈 config_template.json 에 선언이 없는 키는 저장되지 않는다.** 저장 결과에
#     '미저장(템플릿에 없는 키)' 로 돌려준다 — 새 키는 템플릿부터 고쳐야 한다.
#   · local_nodes 레코드는 bind_port 가 0 이면 넣지 않는다 (미사용 transport 처리).
#   · **JwtSecret 은 여기 적지 않는다** — OAM 이 그룹 공통 신원으로 주입한다.
#     손으로 넣으면 그 신원과 어긋나 토큰 검증이 전부 깨진다 (매뉴얼 §3).
#   · 도메인을 바꾸면 **18 단계도 다시 돌려야 한다** — ha1 이 도메인으로 결박돼 있어
#     어긋나면 등록이 401 로 실패한다:  sudo ./tb-install.sh --role db-data --reconfigure
# =============================================================

[vars]
# 사이트마다 바꿀 값 — 아래 줄들이 이 이름으로 참조한다. 한 곳만 고치면 전부 따라간다.
SIP_IP      = 121.161.164.46
RTP_IP      = 121.161.164.46
MGMT_IP     = 121.161.164.46

SIP_UDP     = 5060
SIP_TCP     = 25061
SIP_TLS     = 5061

PTT_SERVICE   = mcptt
PTT_DOMAIN    = ptt.cims.example.kr
VOLTE_SERVICE = volte
VOLTE_DOMAIN  = volte.cims.example.kr

# auth realm — **비워두면 CSP 가 domain 을 realm 으로 쓴다** (18 단계의 ha1 규칙과 같다).
# 비운 채로 두는 것이 정상이고, 대부분 손댈 일이 없다.
# realm 을 도메인과 다르게 쓸 거면 여기에 값을 넣고 **18 단계도 같은 값으로 다시 돌린다** —
# ha1 이 realm 까지 넣어 계산되므로 한쪽만 바꾸면 등록이 401 로 실패한다:
#   sudo ./tb-install.sh --role db-data --reconfigure
PTT_REALM     =
VOLTE_REALM   =

DB_HOST = 127.0.0.1
DB_PORT = 3306
DB_NAME = cims
DB_USER = cims

# CMP 제어·미디어 수신 포트. cmp 의 ServerPort 와 같아야 한다 —
# csp 와 oam-svc 가 이 값으로 CMP 를 찾는다.
CMP_PORT = 9000


# ── CSP 컬렉션 ────────────────────────────────────────────────
# 컬렉션이 overlay 보다 먼저 들어간다 — CSP 는 primary local_node 가 없으면 기동을
# 중단하므로, 기동(60) 전에 자리를 잡고 있어야 한다.
#
# is_primary 는 UDP 행에만 둔다 — TCP/TLS primary 는 CSP 가 protocol 일치로 고른다.
#
# thread_count 는 수신 스레드 수인데 **UDP 에서만 의미가 있다** — TCP/TLS 는 accept 스레드가
# 1개로 고정이다(csp/CspListenerManager.cpp). 0 은 "지정 안 함" 이고 위험한 값이 아니다:
# 0 이하면 전역 `Setup.Sip.UdpThreadCount` 를 따르고, 그것도 0 이면 1 이 된다.
# 그래서 UDP·TLS 는 0(기본 따름), TCP 만 2 로 둔다.
csp/local_nodes {"name":"access-udp","enabled":true,"is_primary":true,"edge":"access","bind_ip":"${SIP_IP}","bind_port":${SIP_UDP},"protocol":"UDP","thread_count":0}
csp/local_nodes {"name":"access-tcp","enabled":true,"edge":"access","bind_ip":"${SIP_IP}","bind_port":${SIP_TCP},"protocol":"TCP","thread_count":2}
# TLS 행은 tls_cert_path 가 비면 리스너가 아예 열리지 않는다 (A-PRC-012).
# 동봉 csp.pem 은 cert+key 결합이라 tls_key_path 는 비운다.
csp/local_nodes {"name":"access-tls","enabled":true,"edge":"access","bind_ip":"${SIP_IP}","bind_port":${SIP_TLS},"protocol":"TLS","thread_count":0,"tls_cert_path":"${CSP_CERT}","note":"cert+key 결합 PEM — tls_key_path 비움"}

# 접속 서비스 — name 은 subscriptions.csv 의 service_ref 와 같아야 하고, domain 은
# 18 단계가 ha1 을 결박한 그 도메인이어야 한다. 어긋나면 등록이 401 로 실패한다.
# auth_realm 은 위 [vars] 의 *_REALM 을 따른다 — 비면 CSP 가 domain 을 realm 으로 쓴다.
# media_srtp: off|optional|required · sec_mechanisms: 협상 가능한 보안 기법
#
# media_nat_mode=auto — 단말이 NAT 뒤에 있으면 미디어를 latch 로 따라간다(ue_nat_traversal.md).
#   off 면 모든 leg 를 no-NAT 로 취급해서, NAT 뒤 단말의 RTP 가 서버에 닿지 않는다.
# latch_ip_guard=off — latch 소스 IP 가 SIP 시그널링 실소스 IP 와 달라도 허용한다.
#   strict 는 스푸핑 방어지만, 미디어가 시그널링과 다른 경로/주소로 오는 구성에서 latch 가 막힌다.
#   ⚠ 방어를 끄는 설정이다 — 폐쇄망 시험 기준값이고, 노출 구간에서는 strict 를 다시 검토한다.
csp/access_services {"name":"${PTT_SERVICE}","kind":"ptt","domain":"${PTT_DOMAIN}","enabled":true,"inbound_policy":"any","priority":100,"media_nat_mode":"auto","latch_ip_guard":"off","sec_mechanisms":["tls"],"media_srtp":"off","auth_realm":"${PTT_REALM}"}
csp/access_services {"name":"${VOLTE_SERVICE}","kind":"volte","domain":"${VOLTE_DOMAIN}","enabled":true,"inbound_policy":"any","priority":100,"media_nat_mode":"auto","latch_ip_guard":"off","sec_mechanisms":["tls"],"media_srtp":"off","auth_realm":"${VOLTE_REALM}"}


# ── CSP overlay ───────────────────────────────────────────────
csp Setup.Database.Host=${DB_HOST}
csp Setup.Database.Port=${DB_PORT}
csp Setup.Database.DbName=${DB_NAME}
csp Setup.Database.User=${DB_USER}
csp Setup.Database.Password=${TB_DB_APP_PASS}
csp Setup.MediaServer.Endpoints=[{"ip":"${RTP_IP}","port":${CMP_PORT}}]
csp Setup.MediaServer.LocalIp=${SIP_IP}
csp Setup.Fm.OamIp=${MGMT_IP}
# TB 는 cmdp 를 설치하지 않는다 — 켜두면 CSP 가 없는 미디어평면을 찾는다.
csp Setup.McDataMedia.Enable=false
csp Setup.ServiceLogging.Dir=${SVCLOG}


# ── CMP overlay ───────────────────────────────────────────────
cmp ServerIp=${RTP_IP}
cmp RtpIp=${RTP_IP}
cmp CspIp=${SIP_IP}
cmp Fm.OamIp=${MGMT_IP}
cmp ServiceLogging.Dir=${SVCLOG}


# ── CSC overlay ───────────────────────────────────────────────
# CimsRuntimeDir 을 비우면 컬렉션·IdMS 토큰을 <store>/runtime/runtime 에서 찾아
# 빈 목록이 된다 — 번호 추가가 '400 service_ref required' 로 떨어진다 (매뉴얼 §4.2).
csc CimsRuntimeDir=${STORE}
csc CimsDatabase.Host=${DB_HOST}
csc CimsDatabase.Port=${DB_PORT}
csc CimsDatabase.Db=${DB_NAME}
csc CimsDatabase.User=${DB_USER}
csc CimsDatabase.Password=${TB_DB_APP_PASS}
# 게이트웨이 뒤 내부 API — 실주소로 열면 우회 경로가 생긴다.
csc Server.Ip=127.0.0.1
csc McpttServer.Ip=${MGMT_IP}
csc CspNotify.Ip=${SIP_IP}
csc PspNotify.Ip=${SIP_IP}
csc Fm.OamIp=${MGMT_IP}
csc IdMs.KmsClientReqUrl=https://${MGMT_IP}:4421/keymanagement/identity/v1/init
# 자동 프로비저닝 — 포트를 CSP 리스너와 맞춘다. 템플릿 기본값 15060 을 그대로 두면
# 단말이 그 포트로 붙으려 하고 거기엔 아무것도 없다 (매뉴얼 §4.4, 가장 흔한 함정).
# name 도 같은 성격이다 — ptt 쪽 템플릿 기본값이 'ptt' 라 접속서비스 이름과 다르다.
csc Provisioning.Services.ptt.name=${PTT_SERVICE}
csc Provisioning.Services.ptt.host=${SIP_IP}
csc Provisioning.Services.ptt.port=${SIP_UDP}
csc Provisioning.Services.ptt.tcp_port=${SIP_TCP}
csc Provisioning.Services.ptt.tls_port=${SIP_TLS}
csc Provisioning.Services.ptt.domain=${PTT_DOMAIN}
csc Provisioning.Services.volte.name=${VOLTE_SERVICE}
csc Provisioning.Services.volte.host=${SIP_IP}
csc Provisioning.Services.volte.port=${SIP_UDP}
csc Provisioning.Services.volte.tcp_port=${SIP_TCP}
csc Provisioning.Services.volte.tls_port=${SIP_TLS}
csc Provisioning.Services.volte.domain=${VOLTE_DOMAIN}
csc ServiceLogging.Dir=${SVCLOG}


# ── OAM-SVC overlay ───────────────────────────────────────────
oam-svc CimsDatabase.Host=${DB_HOST}
oam-svc CimsDatabase.Port=${DB_PORT}
oam-svc CimsDatabase.Db=${DB_NAME}
oam-svc CimsDatabase.User=${DB_USER}
oam-svc CimsDatabase.Password=${TB_DB_APP_PASS}
oam-svc CspNotify.Ip=${SIP_IP}
oam-svc MediaServer.Endpoints=[{"ip":"${RTP_IP}","port":${CMP_PORT}}]
