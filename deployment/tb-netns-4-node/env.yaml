# tb-netns-4-node 환경 — Test Bed (NetNS 4 node)
#
# 단일 host 위에 ip netns 4개로 ctrl-a/b + media-a/b 노드 구성.
# 3 bridge (mgmt/svc/int) + Control-Server A/S (VIP 10.0.1.13) + Media-Server AA.
#
# 셋업: sudo ./verify/scripts/ha-netns-up.sh
# 상태: sudo ./verify/scripts/ha-netns-status.sh

name:        tb-netns-4-node
description: 단일 host 위 NetNS 4 노드 (ctrl-a/b A/S + media-a/b AA) — TB 검증 환경
kind:        netns

csc:
  url:   https://10.0.0.1:4419
  notes: TB-CSC 가 host 에서 동작. ns 가 mgmt bridge (10.0.0.1) 통해 접근

# 가입자 도메인 (users / volte_subscriptions / ptt_subscriptions / organizations) 은
# 외부 DB 위임 결정 ([[project_db_external]]) 이지만 TB 환경엔 DB 미연결.
# scenario.yaml 에서 subscribers.source=file 로 우회 가능.
database: null

# 서비스 로깅 (CSP/CMP 의 ServiceLogging 섹션) — host 측 마운트 디렉토리.
# TB 환경은 host 에 ext_mnt 마운트가 있어 build/dist/ 아래 사용.
service_logging:
  dir:            /home/nex/work/cims/build/dist/ext_mnt/service_log
  enable:         [sip, cmp, csc]      # csp 의 ServiceLogging.Enable
  enable_for_cmp: [csp]                # cmp 의 ServiceLogging.Enable
  recording:      true

networks:
  - id:      mgmt
    cidr:    10.0.0.0/24
    purpose: agent ↔ CSC 통신 (관리). VRRP advertise multicast 도 통과
    bridge:  br-cims-mgmt
  - id:      svc
    cidr:    10.0.1.0/24
    purpose: 서비스 트래픽 (SIP / RTP). VIP 가 여기 붙음
    bridge:  br-cims-svc
  - id:      int
    cidr:    10.0.2.0/24
    purpose: 노드 간 내부 통신 (CMP control / sync 등)
    bridge:  br-cims-int

nodes:
  - id:        ctrl-a
    agent_id:  1
    role_hint: control-server (master)
    netns:     ctrl-a
    nics:
      - { iface: mgmt, net: mgmt, ip: 10.0.0.11, mask: 24 }
      - { iface: svc,  net: svc,  ip: 10.0.1.11, mask: 24 }
      - { iface: int,  net: int,  ip: 10.0.2.11, mask: 24 }

  - id:        ctrl-b
    agent_id:  2
    role_hint: control-server (backup)
    netns:     ctrl-b
    nics:
      - { iface: mgmt, net: mgmt, ip: 10.0.0.12, mask: 24 }
      - { iface: svc,  net: svc,  ip: 10.0.1.12, mask: 24 }
      - { iface: int,  net: int,  ip: 10.0.2.12, mask: 24 }

  - id:        media-a
    agent_id:  3
    role_hint: media-server (AA)
    netns:     media-a
    nics:
      - { iface: mgmt, net: mgmt, ip: 10.0.0.21, mask: 24 }
      - { iface: svc,  net: svc,  ip: 10.0.1.21, mask: 24 }
      - { iface: int,  net: int,  ip: 10.0.2.21, mask: 24 }

  - id:        media-b
    agent_id:  4
    role_hint: media-server (AA)
    netns:     media-b
    nics:
      - { iface: mgmt, net: mgmt, ip: 10.0.0.22, mask: 24 }
      - { iface: svc,  net: svc,  ip: 10.0.1.22, mask: 24 }
      - { iface: int,  net: int,  ip: 10.0.2.22, mask: 24 }

ha_groups:
  - id:      1
    name:    Control-Server
    mode:    active_standby
    members:
      - { node: ctrl-a, role: master, priority: 100 }
      - { node: ctrl-b, role: backup, priority: 90 }
    vips:
      - slot:      "서비스"
        ip:        10.0.1.13
        net:       svc
        vrid:      51
        auth_pass: "00000000"

  - id:      2
    name:    Media-Server
    mode:    all_active
    members:
      - { node: media-a, role: backup, priority: 100 }
      - { node: media-b, role: backup, priority: 90 }
    vips: []   # AA — VIP 불필요
