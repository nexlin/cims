# volte-ptt 시나리오 (tb-netns-4-node 환경)
#
# Control-Server (ctrl-a/b, A/S, VIP 10.0.1.13) 에 CSP — CSCF/TAS/PTT_AS 활성.
# Media-Server (media-a/b, AA) 에 CMP — VoIP RTP + PTT RTP/Floor 양쪽 활성.
# IBCF 비활성. 가입자 도메인은 file seed (DB 미연결).
#
# 1콜 검증 목표:
#   1. cspsim → VIP 10.0.1.13:5060 REGISTER 200 OK
#   2. cspsim INVITE → csp B2BUA → CMP add → RTP relay
#   3. ctrl-a 죽이면 ctrl-b 가 VIP + csp 인수 후 cspsim 재호 가능

name:        volte-ptt
description: VoLTE + PTT (IBCF 제외). VIP 10.0.1.13 로 SIP listen + CMP relay
env:         tb-netns-4-node

# ──────────────────────────────────────────────────────────
#  services — csp 의 Roles
# ──────────────────────────────────────────────────────────
services:
  cscf:   true       # REGISTER / SUBSCRIBE / Digest 인증
  tas:    true       # VoIP B2BUA — DND / 착신전환 / 콜픽업
  ptt_as: true       # PTT 그룹콜 (multipart INVITE + OMA POC XML)
  ibcf:  false       # IP-PBX 트렁크 미사용

# ──────────────────────────────────────────────────────────
#  deployments — ha_group → 패키지 매핑
# ──────────────────────────────────────────────────────────
deployments:
  - ha_group: 1                        # Control-Server (A/S)
    packages:
      - { name: csp, version: 0.0.1, process_name: CSP }

  - ha_group: 2                        # Media-Server (AA)
    packages:
      - { name: cmp, version: 0.0.1, process_name: CMP }

  - ha_group: 3                        # Simulator (standalone) — install 만 (cspsim 은 daemon 아님)
    packages:
      - { name: cspsim, version: 0.0.1, process_name: CSPSIM }

# ──────────────────────────────────────────────────────────
#  csp_config — Layer 별 값
# ──────────────────────────────────────────────────────────
csp_config:

  # ── Layer 0 — _infra (csp.json Setup.*) ──
  setup:
    sip:
      udp_thread_count:     2
      stack_execute_period: 20
      min_register_timeout: 60
      user_timeout:         3600
      send_options_period:  0
      stale_call_timeout:   300
      tcp_thread_count:     2
      tcp_recv_timeout:     600
      tls_accept_timeout:   10
      cert_file:            cert/csp.pem
    media_server:
      # auto: env 의 ha_group=2 (Media-Server) 의 멤버 svc IP 자동.
      # AA mode 라 cmp 가 2 대 → CmpClient endpoint 분배는 1.E-2 (LIVE 활성 stub).
      # 일단 media-a 1대만 primary endpoint 로 사용.
      auto:                 true
      enable:               true
      control_port:         9000
      local_port:           9001
    log:
      max_size_mb:    10
      level:          { debug: true, info: true, network: true, sql: false }
    database:
      # env.database 가 null 이므로 csp 는 DB 연결 실패 후 file fallback 으로 전환.
      use_env: true
    monitor:
      port: 16000
      client_ip_list: ["192.168.199.129"]    # host 의 dev VM IP (admin/모니터링 접근)
    security:
      deny_sip_user_agents: [friendly-scanner, sundayddr]

  # ── Layer 1 — local_nodes (CSP 자기 자신 SIP listener) ──
  local_nodes:
    auto: true
    # auto 동작 (Phase 4 generator 가 구현):
    #   env.ha_groups[1] (active_standby) → VIP 10.0.1.13 row 3개 (UDP/TCP/TLS)
    #   is_primary=true / enabled=true / edge=access
    #   양 멤버 (ctrl-a, ctrl-b) install dir 에 동일 jsonl 배포
    # 필요 시 override:
    overrides: []

  # ── Layer 2 — remote_nodes ──
  remote_nodes:
    auto_cmp: true
    # auto_cmp 동작: env 의 cmp ha_group (id=2, AA) 멤버별 row
    #   media-a 10.0.1.21:9000 / media-b 10.0.1.22:9000 — 두 endpoint 모두 등록
    #   csp 의 CmpClient 가 fail-over endpoint 후보로 활용
    extra: []                          # IBCF / 외부 peer 없음

  # ── Layer 3 — access_services (Realm 정의) ──
  access_services:
    - name:            volte-basic
      kind:            volte
      domain:          ims.mnc033.mcc450.3gppnetwork.org
      auth_realm:      ims.mnc033.mcc450.3gppnetwork.org
      inbound_policy:  default-inbound
      priority:        100
      enabled:         true
      listener_ids:    [csp-main-udp]   # auto 생성 id 와 매칭 (generator 가 검증)

    - name:            ptt-basic
      kind:            ptt
      domain:          ptt.mnc033.mcc450.3gppnetwork.org
      auth_realm:      ptt.mnc033.mcc450.3gppnetwork.org
      inbound_policy:  default-inbound
      priority:        100
      enabled:         true
      listener_ids:    [csp-main-udp]

  # ── Layer 4-6 — routes / route_sets / routing_policies ──
  routes:
    - id:        route-volte
      match:     { domain: ims.mnc033.mcc450.3gppnetwork.org }
      target:    csp-main-udp           # local_nodes.id (auto)
      priority:  100
      enabled:   true

    - id:        route-ptt
      match:     { domain: ptt.mnc033.mcc450.3gppnetwork.org }
      target:    csp-main-udp
      priority:  100
      enabled:   true

  route_sets:
    - id:      default
      routes:  [route-volte, route-ptt]
      enabled: true

  routing_policies:
    - id:         default-inbound
      match:      { direction: inbound }
      route_set:  default
      priority:   100
      enabled:    true

  # ── Layer 7-9 — rules / rule_sets / acl_policies ──
  rules:
    - id:      allow-mgmt-net
      match:   { source_cidr: 10.0.0.0/24 }    # mgmt 망 — TB 환경
      action:  allow
      enabled: true
    - id:      allow-svc-net
      match:   { source_cidr: 10.0.1.0/24 }    # svc 망
      action:  allow
      enabled: true

  rule_sets:
    - id:      default
      rules:   [allow-mgmt-net, allow-svc-net]
      enabled: true

  acl_policies:
    - id:         default-acl
      rule_set:   default
      applied_to: [csp-main-udp, csp-main-tcp, csp-main-tls]
      priority:   100
      enabled:    true

# ──────────────────────────────────────────────────────────
#  cmp_config — Media 측
# ──────────────────────────────────────────────────────────
cmp_config:
  auto: true
  # auto 동작:
  #   media-a 의 cmp.json: ServerIp=10.0.1.21, RtpIp=10.0.1.21, CspIp=10.0.1.13 (Control VIP)
  #   media-b 의 cmp.json: ServerIp=10.0.1.22, RtpIp=10.0.1.22, CspIp=10.0.1.13
  overrides:
    server_port:           9000
    csp_port:              9001
    rtp_start_port:        50000
    rtp_pool_size:         20
    ptt_rtp_start_port:    52000
    ptt_rtp_pool_size:     10
    ptt_floor_start_port:  54000
    ptt_video_start_port:  56000
    rtp_worker_count:      4
    enable_dtmf_ptt:       true
    dtmf_push_digit:       "*"
    dtmf_release_digit:    "#"
    session_timeout:       600

# ──────────────────────────────────────────────────────────
#  subscribers — file seed (env.database=null 이라 DB 우회)
# ──────────────────────────────────────────────────────────
subscribers:
  source: file

  # CSP 의 user/ 디렉토리에 1 user.json 씩 생성됨 (이미 build/dist 에 seed 데이터 있음 — generator 가 중복 회피)
  users:
    # VoLTE basic — 호 시도 시 짝꿍
    - sip_id:    "+821357007001"
      auth_id:   "450033100000001"
      domain:    ims.mnc033.mcc450.3gppnetwork.org
      passwd:    "123456"
      org_id:    ""

    - sip_id:    "+821357007002"
      auth_id:   "450033100000002"
      domain:    ims.mnc033.mcc450.3gppnetwork.org
      passwd:    "123456"
      org_id:    ""

    # PTT — group 멤버
    - sip_id:    "+82571900001"
      auth_id:   "4503382571900001"
      domain:    ptt.mnc033.mcc450.3gppnetwork.org
      passwd:    "123456"
      org_id:    ""

    - sip_id:    "+82571900002"
      auth_id:   "4503382571900002"
      domain:    ptt.mnc033.mcc450.3gppnetwork.org
      passwd:    "123456"
      org_id:    ""

  # service_binding — DB 부재 시 file seed.
  # 어제 발견한 "Auth reject: ... has no service binding" 의 fix.
  # 데이터 위치: csp/user/<sip_id>.json 의 service_bindings[] 또는 별도 file_store 도메인.
  # 정확한 위치는 Phase 4 generator 가 csp 코드 분석 후 결정 (현재는 의도만 기록).
  volte_bindings:
    - { user: "+821357007001", service: volte-basic }
    - { user: "+821357007002", service: volte-basic }

  ptt_bindings:
    - { user: "+82571900001", service: ptt-basic, group: "+82571910001" }
    - { user: "+82571900002", service: ptt-basic, group: "+82571910001" }

# ──────────────────────────────────────────────────────────
#  사전 조건 (host / OS 수준 — generator 가 검증 + 안내)
# ──────────────────────────────────────────────────────────
prerequisites:
  sysctl:
    # A/S + VIP bind 위해 BACKUP 노드도 VIP 로 bind 가능해야 함.
    # 각 ns 안에서도 설정 필요 (NetNS 별 net.* sysctl 독립).
    - { key: net.ipv4.ip_nonlocal_bind, value: 1, scope: host }
    - { key: net.ipv4.ip_nonlocal_bind, value: 1, scope: "netns:ctrl-a" }
    - { key: net.ipv4.ip_nonlocal_bind, value: 1, scope: "netns:ctrl-b" }

  packages_installed:
    - keepalived           # 이미 설치 (어제 apt install)

# ──────────────────────────────────────────────────────────
#  검증 entry — render 후 자동 검증 시 사용 (Phase 5)
# ──────────────────────────────────────────────────────────
verify:
  expected_listen:
    - { node: ctrl-a, ip: 10.0.1.13, port: 5060, proto: UDP, owner: csp }
    - { node: ctrl-a, ip: 10.0.1.13, port: 25061, proto: TCP, owner: csp }
    - { node: ctrl-a, ip: 10.0.1.13, port: 5061, proto: TCP, owner: csp }
    - { node: media-a, ip: 10.0.1.21, port: 9000, proto: UDP, owner: cmp }
    - { node: media-b, ip: 10.0.1.22, port: 9000, proto: UDP, owner: cmp }

  smoke:
    # at: 어느 노드에서 cspsim 실행 (env.nodes[].id, netns 사용)
    # expect: cspsim stdout 의 regex 매칭
    - name:    register-ptt
      at:      sim-a
      cmd:     cspsim
      args:    { server_ip: 10.0.1.13, local_ip: 10.0.1.31, count: 1,
                 user: "+82571900001",
                 domain: ptt.mnc033.mcc450.3gppnetwork.org,
                 password: "123456", mode: ptt, scenario: register }
      expect:  'Registered\s*:\s*1\s*/\s*1'

    - name:    register-volte
      at:      sim-a
      cmd:     cspsim
      args:    { server_ip: 10.0.1.13, local_ip: 10.0.1.31, count: 1,
                 user: "+821357007001",
                 auth_id: "450033100000001@ims.mnc033.mcc450.3gppnetwork.org",
                 domain: ims.mnc033.mcc450.3gppnetwork.org,
                 password: "123456", mode: volte, scenario: register }
      expect:  'Registered\s*:\s*1\s*/\s*1'

    - name:    call-ptt-1on1
      at:      sim-a
      cmd:     cspsim
      args:    { server_ip: 10.0.1.13, local_ip: 10.0.1.31, count: 2,
                 user: "+82571900001",
                 domain: ptt.mnc033.mcc450.3gppnetwork.org,
                 password: "123456", mode: ptt, scenario: call, call_duration: 5 }
      expect:  'Call OK/End\s*:\s*2'

  failover:
    # action 은 host (또는 netns 내부) 에서 실행할 shell 명령.
    # ${VAR} placeholder 사용 가능 — verify.py 가 env 의 노드/VIP 정보로 치환.
    - name:              ctrl-a-down
      action:            |
        ka_pid=$(cat /tmp/ctrl-a-keepalived.pid 2>/dev/null || echo "")
        [[ -n "$ka_pid" ]] && sudo kill -TERM $ka_pid
      wait_sec:          6
      expect_vip_owner:  ctrl-b
      followup_smoke:    register-ptt
