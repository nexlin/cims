# full 시나리오 (tb-netns-4-node 환경) — VoLTE + PTT + IBCF
#
# volte-ptt 의 superset. IBCF 활성화하고 외부 IP-PBX trunk 1개 정의.
# TB 환경엔 진짜 외부 PBX 없으므로 demo IP (203.0.113.10) 사용 — REGISTER/호는
# 실제로 도달 못함. 검증 목적: routes/route_sets/routing_policies/rules/rule_sets
# 의 진짜 schema (csp 가 정상 파싱하는지) + IBCF role 활성 시 csp 기동 정상성.
#
# 진짜 routing 검증은 prod 환경에서 실제 PBX 연결 후 진행.

name:        full
description: VoLTE + PTT + IBCF (외부 IP-PBX trunk 1개 demo)
env:         tb-netns-4-node

services:
  cscf:   true
  tas:    true
  ptt_as: true
  ibcf:   true       # ← IBCF role 활성

deployments:
  - ha_group: 1
    packages:
      - { name: csp, version: 0.0.1, process_name: CSP }
  - ha_group: 2
    packages:
      - { name: cmp, version: 0.0.1, process_name: CMP }
  - ha_group: 3
    packages:
      - { name: cspsim, version: 0.0.1, process_name: CSPSIM }

csp_config:
  setup:
    sip:
      udp_thread_count: 2
      tcp_thread_count: 2
    media_server:
      auto: true
    log:
      max_size_mb: 10
      level: { debug: true, info: true, network: true, sql: false }
    database:
      use_env: true
    monitor:
      port: 16000
      client_ip_list: ["192.168.199.129"]
    security:
      deny_sip_user_agents: [friendly-scanner, sundayddr]

  local_nodes: { auto: true }

  remote_nodes:
    auto_cmp: true
    # IBCF trunk — 외부 IP-PBX endpoint.
    # 진짜 schema: id/name/ip/port/protocol/remote_domain/srv_lookup/...
    extra:
      - id:            ibcf-trunk
        name:          ibcf-trunk
        ip:            203.0.113.10
        port:          5060
        protocol:      UDP
        remote_domain: pbx.example.com
        enabled:       true
        note:          외부 IP-PBX (demo IP — TB 환경에선 도달 불가)

  access_services:
    - name:           volte-basic
      kind:           volte
      domain:         ims.mnc033.mcc450.3gppnetwork.org
      auth_realm:     ims.mnc033.mcc450.3gppnetwork.org
      inbound_policy: default-inbound
      priority:       100
      enabled:        true
      allowed_local_node_refs:   [csp-main-udp]

    - name:           ptt-basic
      kind:           ptt
      domain:         ptt.mnc033.mcc450.3gppnetwork.org
      auth_realm:     ptt.mnc033.mcc450.3gppnetwork.org
      inbound_policy: default-inbound
      priority:       100
      enabled:        true
      allowed_local_node_refs:   [csp-main-udp]

  # ── routes — (local, remote) pair (CspRouteMap.cpp) ──
  routes:
    - name:            csp-to-pbx
      local_node_ref:  csp-main-udp
      remote_node_ref: ibcf-trunk
      register_to_remote: false
      enabled:         true
      note:            VoIP outbound → 외부 PBX

  # ── route_sets — outbound 라우팅 후보 묶음 (CspRouteSetMap.cpp) ──
  route_sets:
    - name:                 pbx-trunk-set
      distribution_policy:  failover
      health_check_mode:    options_ping
      members:
        - { route_ref: csp-to-pbx, priority: 100, weight: 1 }
      enabled:              true

  # ── rules — name/field/op/value (CspRuleEvaluator.cpp) ──
  rules:
    # 외부 PBX 도메인 매칭 (To URI host 가 pbx.example.com 이면)
    - name:    to-host-is-pbx
      field:   to_uri_host
      op:      eq
      value:   pbx.example.com
      enabled: true

  # ── rule_sets — rules 의 묶음 (combinator AND/OR) ──
  rule_sets:
    - name:       match-pbx-outbound
      combinator: AND
      members:
        - { rule_ref: to-host-is-pbx, negate: false }
      enabled:    true

  # ── routing_policies — match_rule_set_ref + target_ref (CspRoutingPolicyEngine.cpp) ──
  routing_policies:
    - name:                pbx-outbound
      priority:            100
      match_rule_set_ref:  match-pbx-outbound
      target_type:         route_set
      target_ref:          pbx-trunk-set
      fail_action:         next_policy
      enabled:             true

  # ── acl_policies — match_rule_set_ref + action (CspAclPolicyEngine.cpp) ──
  # full 시나리오는 ACL 없이 default allow. 운영에선 필요 시 정의.
  acl_policies: []

cmp_config:
  auto: true
  overrides:
    server_port:        9000
    csp_port:           9001
    rtp_pool_size:      20
    ptt_rtp_pool_size:  10
    session_timeout:    600

subscribers:
  source: file
  users:
    - { sip_id: "+821357007001", auth_id: "450033100000001",
        domain: ims.mnc033.mcc450.3gppnetwork.org, passwd: "123456" }
    - { sip_id: "+821357007002", auth_id: "450033100000002",
        domain: ims.mnc033.mcc450.3gppnetwork.org, passwd: "123456" }
    - { sip_id: "+82571900001", auth_id: "4503382571900001",
        domain: ptt.mnc033.mcc450.3gppnetwork.org, passwd: "123456" }
    - { sip_id: "+82571900002", auth_id: "4503382571900002",
        domain: ptt.mnc033.mcc450.3gppnetwork.org, passwd: "123456" }
  volte_bindings:
    - { user: "+821357007001", service: volte-basic }
    - { user: "+821357007002", service: volte-basic }
  ptt_bindings:
    - { user: "+82571900001", service: ptt-basic, group: "+82571910001" }
    - { user: "+82571900002", service: ptt-basic, group: "+82571910001" }

prerequisites:
  sysctl:
    - { key: net.ipv4.ip_nonlocal_bind, value: 1, scope: host }
    - { key: net.ipv4.ip_nonlocal_bind, value: 1, scope: "netns:ctrl-a" }
    - { key: net.ipv4.ip_nonlocal_bind, value: 1, scope: "netns:ctrl-b" }
  packages_installed: [keepalived]

verify:
  expected_listen:
    - { node: ctrl-a, ip: 10.0.1.13, port: 5060,  proto: UDP, owner: csp }
    - { node: ctrl-a, ip: 10.0.1.13, port: 25061, proto: TCP, owner: csp }
    - { node: ctrl-a, ip: 10.0.1.13, port: 5061,  proto: TCP, owner: csp }
    - { node: media-a, ip: 10.0.1.21, port: 9000, proto: UDP, owner: cmp }
    - { node: media-b, ip: 10.0.1.22, port: 9000, proto: UDP, owner: cmp }

  # smoke — IBCF 호는 demo PBX IP 라 실제 호출 불가. REGISTER 만 검증.
  smoke:
    - name:   register-ptt
      at:     sim-a
      cmd:    cspsim
      args:   { server_ip: 10.0.1.13, local_ip: 10.0.1.31, count: 1,
                user: "+82571900001",
                domain: ptt.mnc033.mcc450.3gppnetwork.org,
                password: "123456", mode: ptt, scenario: register }
      expect: 'Registered\s*:\s*1\s*/\s*1'

    - name:   register-volte
      at:     sim-a
      cmd:    cspsim
      args:   { server_ip: 10.0.1.13, local_ip: 10.0.1.31, count: 1,
                user: "+821357007001",
                auth_id: "450033100000001@ims.mnc033.mcc450.3gppnetwork.org",
                domain: ims.mnc033.mcc450.3gppnetwork.org,
                password: "123456", mode: volte, scenario: register }
      expect: 'Registered\s*:\s*1\s*/\s*1'

  # failover — volte-ptt 와 동일
  failover:
    - name:              ctrl-a-down
      action: |
        ka_pid=$(cat /tmp/ctrl-a-keepalived.pid 2>/dev/null || echo "")
        [[ -n "$ka_pid" ]] && sudo kill -TERM $ka_pid
      wait_sec:          6
      expect_vip_owner:  ctrl-b
      followup_smoke:    register-ptt
