# prod-multi-host 환경 — 상용 2-host (Control A/S + Media AA)
#
# 가상의 reference 환경. NetNS 가 아니라 실제 host 2~3 대 위에 배포.
# 운영 시 IP/도메인/VIP 는 사이트별로 override 필요 (이 파일은 골격 + 컨벤션).
#
# 토폴로지:
#   ctrl-1 (10.1.0.11) ─ Control-Server (A/S MASTER) — csp + csc + ha
#   ctrl-2 (10.1.0.12) ─ Control-Server (A/S BACKUP)
#         └ VIP 10.1.0.10 (svc)
#   media-1 (10.1.1.21) ─ Media-Server (AA) — cmp
#   media-2 (10.1.1.22) ─ Media-Server (AA)
#
# DB 는 외부 위임 (별도 HA pair). agent 는 mgmt 망 (10.1.255.0/24) 으로
# CSC 와 통신.

name:        prod-multi-host
description: 상용 reference — Control 2-host A/S + Media 2-host AA + 외부 DB
kind:        multi-host

csc:
  url:   https://10.1.255.10:4419
  notes: 상용 CSC (외부 HA 또는 K8s service)

database:
  host:     10.1.255.20    # 외부 DB HA endpoint
  port:     3306
  user:     cims
  password: __REPLACE_ME__
  dbname:   cims

service_logging:
  dir:            /var/log/cims/service_log
  enable:         [sip, cmp, csc]
  enable_for_cmp: [csp]
  recording:      true

networks:
  - id:      mgmt
    cidr:    10.1.255.0/24
    purpose: agent ↔ CSC 관리망
  - id:      svc
    cidr:    10.1.0.0/24
    purpose: 서비스 트래픽 (SIP 외부) — Control VIP
  - id:      media
    cidr:    10.1.1.0/24
    purpose: RTP 트래픽 (CMP)
  - id:      int
    cidr:    10.1.254.0/24
    purpose: 노드 간 내부 통신 (sync / DB replication 등)

nodes:
  - id:        ctrl-1
    agent_id:  101
    role_hint: control-server (master)
    nics:
      - { iface: ens3, net: mgmt,  ip: 10.1.255.11, mask: 24 }
      - { iface: ens4, net: svc,   ip: 10.1.0.11,   mask: 24 }
      - { iface: ens5, net: int,   ip: 10.1.254.11, mask: 24 }

  - id:        ctrl-2
    agent_id:  102
    role_hint: control-server (backup)
    nics:
      - { iface: ens3, net: mgmt,  ip: 10.1.255.12, mask: 24 }
      - { iface: ens4, net: svc,   ip: 10.1.0.12,   mask: 24 }
      - { iface: ens5, net: int,   ip: 10.1.254.12, mask: 24 }

  - id:        media-1
    agent_id:  103
    role_hint: media-server (AA)
    nics:
      - { iface: ens3, net: mgmt,  ip: 10.1.255.21, mask: 24 }
      - { iface: ens4, net: media, ip: 10.1.1.21,   mask: 24 }
      - { iface: ens5, net: int,   ip: 10.1.254.21, mask: 24 }

  - id:        media-2
    agent_id:  104
    role_hint: media-server (AA)
    nics:
      - { iface: ens3, net: mgmt,  ip: 10.1.255.22, mask: 24 }
      - { iface: ens4, net: media, ip: 10.1.1.22,   mask: 24 }
      - { iface: ens5, net: int,   ip: 10.1.254.22, mask: 24 }

ha_groups:
  - id:      1
    name:    Control-Server
    mode:    active_standby
    members:
      - { node: ctrl-1, role: master, priority: 100 }
      - { node: ctrl-2, role: backup, priority: 90 }
    vips:
      - slot:      "서비스"
        ip:        10.1.0.10
        net:       svc
        vrid:      51
        auth_pass: "__REPLACE__"

  - id:      2
    name:    Media-Server
    mode:    all_active
    members:
      - { node: media-1, role: backup, priority: 100 }
      - { node: media-2, role: backup, priority: 90 }
    vips: []
