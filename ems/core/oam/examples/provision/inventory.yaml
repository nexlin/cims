# 자동 배포 — 인벤토리 예제 (접속 자격증명)
#
# ⚠ IP·비밀번호는 전부 예시값이다. 실제 사이트 파일은 이 파일을 고치지 말고 git 밖에
#   따로 만든다 (레포 루트 `provision-site/` 는 .gitignore 처리되어 있다).
#
# "서버가 어디 있고 어떻게 로그인하나" 만 담는다. 서비스 IP·VIP·포트 같은 구성값은
# blueprint.yaml 쪽이다.
#
# 인증은 비밀번호만 쓴다. ssh 비밀번호와 sudo 비밀번호는 보통 같은 계정 비밀번호라
# 같은 값이며, 앵커(&pw)로 한 번만 적고 참조(*pw)한다.
#
# 파일 권한은 0600 이어야 한다 (아니면 CLI 가 로드를 거부).
version: 1

defaults:
  ssh:
    user: user01
    port: 22                # 비표준 포트면 서버별로 덮어쓴다
  sudo:
    method: password        # password | nopasswd (sudoers 에 NOPASSWD 등록된 경우)
  install_dir: /opt/cims-agent

servers:
  # ── OAM 부트스트랩 노드 ─────────────────────────────────────────
  # install.sh 를 직접 실행한 노드. agent 가 이미 설치·enroll 되어 있어 SSH 하지 않는다
  # → 접속 정보가 필요 없다. name 은 OAM 에 등록된 agent 이름과 정확히 일치해야 한다.
  - name: oam01
    host: 10.0.0.10
    agent_preinstalled: true

  # ── csc — 가입자/MCPTT (A/S 이중화) ─────────────────────────────
  - name: csc01
    host: 10.0.1.11
    ssh:  { password: &pw_csc01 "EXAMPLE_ONLY" }
    sudo: { password: *pw_csc01 }

  - name: csc02
    host: 10.0.1.12
    ssh:  { password: &pw_csc02 "EXAMPLE_ONLY" }
    sudo: { password: *pw_csc02 }

  # ── csp — SIP 시그널링 (A/S 이중화) ─────────────────────────────
  - name: csp01
    host: 10.0.2.11
    ssh:  { password: &pw_csp01 "EXAMPLE_ONLY" }
    sudo: { password: *pw_csp01 }

  - name: csp02
    host: 10.0.2.12
    ssh:  { password: &pw_csp02 "EXAMPLE_ONLY" }
    sudo: { password: *pw_csp02 }

  # ── cmp — RTP 미디어 (AA 분산) ──────────────────────────────────
  - name: cmp01
    host: 10.0.3.11
    ssh:  { password: &pw_cmp01 "EXAMPLE_ONLY" }
    sudo: { password: *pw_cmp01 }

  - name: cmp02
    host: 10.0.3.12
    ssh:  { password: &pw_cmp02 "EXAMPLE_ONLY" }
    sudo: { password: *pw_cmp02 }
