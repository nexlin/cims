<title>시나리오 캔버스</title>
<style>
:root{
  --background:#f4f6fb; --foreground:#161a2b; --card:#ffffff; --muted:#f8fafc; --muted-foreground:#64748b;
  --secondary:#eef1f7; --secondary-foreground:#475569; --accent:#f2f6fe; --border:#e5e8f1;
  --primary:#4f46e5; --primary-foreground:#fff; --ring:#4f46e5;
  --success:#15803d; --success-soft:#dcfce7; --warning:#b45309; --warning-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2; --info:#0369a1; --info-soft:#e0f2fe;
  --lane:#eef1f7; --grid:#e5e8f1; --shadow:0 1px 2px rgba(22,26,43,.06),0 4px 14px rgba(22,26,43,.06);
  --ue:#0369a1; --ue-soft:#e0f2fe; --peer:#b45309; --peer-soft:#fef3c7; --real:#15803d; --real-soft:#dcfce7;
  --ph-pre:#0f766e; --ph-body:#4f46e5; --ph-epi:#64748b;
  --radius:8px; --radius-lg:14px;
  --sans:'Pretendard Variable',Pretendard,'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --background:#0b0f17; --foreground:#e6e9f1; --card:#151c2b; --muted:#111827; --muted-foreground:#93a1b8;
  --secondary:#1d2636; --secondary-foreground:#93a1b8; --accent:#1b2435; --border:#2a3346;
  --primary:#6366f1; --ring:#6366f1;
  --success:#4ade80; --success-soft:#14532d; --warning:#fbbf24; --warning-soft:#451a03; --danger:#f87171; --danger-soft:#450a0a; --info:#38bdf8; --info-soft:#0c4a6e;
  --lane:#111827; --grid:#1d2636; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --ue:#38bdf8; --ue-soft:#0c4a6e; --peer:#fbbf24; --peer-soft:#451a03; --real:#4ade80; --real-soft:#14532d;
  --ph-pre:#2dd4bf; --ph-body:#818cf8; --ph-epi:#93a1b8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --background:#0b0f17; --foreground:#e6e9f1; --card:#151c2b; --muted:#111827; --muted-foreground:#93a1b8;
  --secondary:#1d2636; --secondary-foreground:#93a1b8; --accent:#1b2435; --border:#2a3346;
  --primary:#6366f1; --ring:#6366f1;
  --success:#4ade80; --success-soft:#14532d; --warning:#fbbf24; --warning-soft:#451a03; --danger:#f87171; --danger-soft:#450a0a; --info:#38bdf8; --info-soft:#0c4a6e;
  --lane:#111827; --grid:#1d2636; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --ue:#38bdf8; --ue-soft:#0c4a6e; --peer:#fbbf24; --peer-soft:#451a03; --real:#4ade80; --real-soft:#14532d;
  --ph-pre:#2dd4bf; --ph-body:#818cf8; --ph-epi:#93a1b8;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;min-height:640px}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--muted);flex-wrap:wrap}
.toolbar h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.toolbar .sub{color:var(--muted-foreground);font-size:12px}
.toolbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar label.tl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground)}
.toolbar select{height:30px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:0 8px;font-size:12.5px;max-width:300px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.pal-item:focus-visible,.srow:focus-visible,.lane-h:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.badge.neutral{background:var(--secondary);color:var(--secondary-foreground)}
.badge.info{background:var(--info-soft);color:var(--info)}
.mono{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.kind{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--secondary);color:var(--secondary-foreground);white-space:nowrap}
.kind.ue{background:var(--ue-soft);color:var(--ue)}.kind.peer{background:var(--peer-soft);color:var(--peer)}.kind.real{background:var(--real-soft);color:var(--real)}.kind.none{background:var(--danger-soft);color:var(--danger)}
/* layout */
.main{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr) 340px}
@media (max-width:900px){.main{grid-template-columns:1fr}.palette,.inspector{border:none;border-top:1px solid var(--border)}}
.palette{border-right:1px solid var(--border);background:var(--card);padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.pal-group{border-bottom:1px solid var(--border);padding-bottom:8px}
.pal-group:last-of-type{border-bottom:none}
.pal-group h2{margin:0;display:flex;align-items:center;gap:6px;height:32px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;cursor:pointer;user-select:none;border-radius:6px;padding:0 4px}
.pal-group h2:hover{background:var(--accent);color:var(--foreground)}
.pal-group h2 .chev{width:14px;height:14px;transition:transform .15s;flex:none}
.pal-group h2 .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:500;padding:0 6px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground)}
.pal-group .items{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.pal-group.collapsed .items{display:none}
.pal-group.collapsed h2 .chev{transform:rotate(-90deg)}
.pal-group.collapsed{padding-bottom:0}
.pal-item{display:flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);cursor:grab;user-select:none}
.pal-item:active{cursor:grabbing}
.pal-item.off{opacity:.45;cursor:not-allowed}
.pal-item .ic{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:10px;font-weight:600}
.pal-item b{font-weight:600;font-size:12px;display:block;font-family:var(--mono)}
.pal-item small{color:var(--muted-foreground);font-size:10.5px;display:block}
.ic.role-ue{background:var(--ue-soft);color:var(--ue)}.ic.role-peer{background:var(--peer-soft);color:var(--peer)}
.ic.g-reg{background:color-mix(in srgb,var(--ph-pre) 18%,transparent);color:var(--ph-pre)}
.ic.g-call{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.ic.g-media{background:var(--success-soft);color:var(--success)}
.ic.g-xfer{background:var(--info-soft);color:var(--info)}
.ic.g-peer{background:var(--peer-soft);color:var(--peer)}
.ic.g-ptt{background:var(--secondary);color:var(--secondary-foreground)}
.ic.g-ctl{background:var(--secondary);color:var(--secondary-foreground)}
.pal-hint{font-size:11.5px;color:var(--muted-foreground);line-height:1.5;border-top:1px solid var(--border);padding-top:10px}
.pal-hint kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--card)}
/* center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.bindbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted-foreground);padding:6px 14px;border-bottom:1px solid var(--border);background:var(--card)}
.bindbar .bchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:2px 4px 2px 9px;background:var(--muted);font-family:var(--mono);font-size:11px;color:var(--foreground)}
.bindbar .bchip input{width:52px;height:20px;border:1px solid var(--border);border-radius:999px;padding:0 6px;font-family:var(--mono);font-size:11px;background:var(--card)}
.bindbar .bchip.unbound{border-color:var(--warning);color:var(--warning)}
.seq-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--background)}
.seq{min-width:900px;padding:14px 16px 40px;display:flex;flex-direction:column;gap:0}
.seq-h{display:grid;grid-template-columns:44px 170px minmax(360px,1fr) 118px 250px;position:sticky;top:0;z-index:3;background:var(--background);padding-bottom:6px}
.seq-h .colh{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;padding:0 8px;align-self:end}
.lanes-h{display:grid;gap:8px}
.lane-h{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;cursor:grab;user-select:none;position:relative;min-width:0;box-shadow:var(--shadow)}
.lane-h.sel{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 30%,transparent),var(--shadow)}
.lane-h.drop-hot{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--card))}
.lane-h.dragging{opacity:.4}
.lane-h .l1{display:flex;align-items:center;gap:6px}
.lane-h .l1 b{font-size:12.5px;font-family:var(--mono)}
.lane-h .l1 .kind{margin-left:auto}
.lane-h .l2{font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lane-h .l3{font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-h .l3.err{color:var(--danger)}
.lane-h .dj{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;color:var(--muted-foreground);z-index:2}
.lane-add{border:1px dashed var(--border);border-radius:var(--radius);display:grid;place-items:center;color:var(--muted-foreground);font-size:11.5px;cursor:pointer;min-height:56px}
.lane-add:hover,.lane-add.drop-hot{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,transparent)}
/* rows */
.phase{display:grid;grid-template-columns:44px 1fr;align-items:center;margin:8px 0 2px}
.phase .pl{grid-column:2;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ph)}
.phase .pl::after{content:"";flex:1;border-top:1px dashed color-mix(in srgb,var(--ph) 50%,transparent)}
.phase .pl small{letter-spacing:0;text-transform:none;font-weight:400;color:var(--muted-foreground)}
.gap{height:8px;margin:0 0 0 44px;border-radius:4px;transition:height .1s}
.gap.drop-hot{height:26px;background:color-mix(in srgb,var(--primary) 12%,transparent);border:1px dashed var(--primary)}
.srow{display:grid;grid-template-columns:44px 170px minmax(360px,1fr) 118px 250px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);min-height:46px;cursor:pointer;position:relative;user-select:none}
.srow:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.srow.sel{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 30%,transparent)}
.srow.err{border-color:var(--danger)}
.srow.dragging{opacity:.4}
.srow .idx{display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted-foreground);border-right:1px solid var(--border);cursor:grab}
.srow .idx .h{width:8px;height:12px;background:radial-gradient(var(--muted-foreground) 1px,transparent 1px);background-size:4px 4px;opacity:.6;margin-bottom:4px}
.srow .stp{padding:6px 8px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.srow .stp b{font-family:var(--mono);font-size:12px;font-weight:600}
.srow .stp small{font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .stp .unsup{color:var(--warning)}
.srow .lanes{position:relative;min-height:44px}
.srow .lanes .lg{position:absolute;top:0;bottom:0;border-left:1px dashed var(--grid)}
.srow .lanes .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--card);border:2.5px solid var(--c);z-index:2}
.srow .lanes .dot.hollow{border-style:dashed}
.srow .lanes .arrow{position:absolute;top:50%;height:0;border-top:2px solid var(--c);transform:translateY(-50%);z-index:1}
.srow .lanes .arrow::after{content:"";position:absolute;right:-2px;top:-5px;border:5px solid transparent;border-left:7px solid var(--c);border-right:0}
.srow .lanes .arrow.rev::after{right:auto;left:-2px;border-left:0;border-right:7px solid var(--c)}
.srow .lanes .alab{position:absolute;top:50%;transform:translate(-50%,calc(-50% - 13px));background:var(--card);border:1px solid var(--border);border-radius:999px;padding:0 7px;font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;z-index:3}
.srow .lanes .band{position:absolute;left:6%;right:6%;top:50%;height:12px;transform:translateY(-50%);border-radius:999px;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 12px);opacity:.55}
.srow .lanes .bandlab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:0 8px;font-family:var(--mono);font-size:10.5px;z-index:3}
/* 세션 열 — 레인 밖 세로 레일. 다이얼로그마다 막대 하나: INVITE~확립 = 점선, 확립~bye = RTP(초록) 또는 시그널링만(회색) */
.srow .rail{position:relative;border-left:1px solid var(--border);overflow:visible}
.srow .rail .rs{position:absolute;top:-9px;bottom:-9px;width:6px;border-radius:3px;z-index:1}
.rs.ring{background:repeating-linear-gradient(180deg,var(--primary) 0 4px,transparent 4px 8px);opacity:.55}
.rs.media{background:var(--success)}
.rs.sig{background:var(--muted-foreground);opacity:.55}
.rs.idle{background:transparent;border:1px dashed var(--border);width:4px}
.rs.est{top:50%}.rs.end{bottom:50%}
.rail .rl{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9.5px;color:var(--muted-foreground);white-space:nowrap;z-index:2}
.rail .rl.g{color:var(--success);font-weight:600}
/* 통화 유지(media_hold) — 시간축 바 + during 마커 */
.srow.hold{min-height:64px}
.srow.hold .lanes .hb{position:absolute;left:6%;right:6%;top:50%;height:14px;transform:translateY(-50%);border-radius:999px;background:color-mix(in srgb,var(--success) 22%,transparent);border:1px solid color-mix(in srgb,var(--success) 45%,transparent);z-index:1}
.srow.hold .lanes .hb.drop-hot{background:color-mix(in srgb,var(--primary) 20%,transparent);border-color:var(--primary)}
.srow.hold .lanes .hb .tk{position:absolute;top:100%;margin-top:3px;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--muted-foreground)}
.srow.hold .lanes .hlab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:0 8px;font-family:var(--mono);font-size:10.5px;z-index:2}
.mk{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:var(--card);border:2.5px solid var(--c);z-index:4;cursor:ew-resize;touch-action:none}
.mk.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 35%,transparent)}
.mk .ml{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-size:10px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--foreground);pointer-events:none}
.mk .ml.up{bottom:calc(100% + 3px)}.mk .ml.dn{top:calc(100% + 3px)}
.srow .idx .t{font-size:9.5px;color:var(--muted-foreground);margin-top:2px}
.srow .exp{padding:6px 8px;border-left:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;align-content:center}
.echip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--muted);white-space:nowrap}
.echip.bad{border-color:var(--danger);color:var(--danger)}
.srow .rm{position:absolute;right:6px;top:6px;border:none;background:transparent;color:var(--muted-foreground);cursor:pointer;font-size:13px;line-height:1;padding:0 3px;border-radius:4px;display:none}
.srow:hover .rm{display:block}
.srow .rm:hover{color:var(--danger);background:var(--danger-soft)}
.seq-empty{margin-left:44px;border:1px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted-foreground);font-size:12.5px}
.seq-empty.drop-hot{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,transparent)}
/* drawer */
.drawer{border-top:1px solid var(--border);background:var(--card);height:250px;display:flex;flex-direction:column;flex:none}
.drawer.collapsed{height:36px}
.tabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);height:36px;flex:none}
.tab{height:36px;padding:0 10px;border:none;background:transparent;cursor:pointer;color:var(--muted-foreground);font-weight:500;font-size:12.5px;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tab.on{color:var(--foreground);border-bottom-color:var(--primary)}
.tab .cnt{font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground)}
.tab .cnt.err{background:var(--danger-soft);color:var(--danger)}
.tab .cnt.warn{background:var(--warning-soft);color:var(--warning)}
.tab .cnt.ok{background:var(--success-soft);color:var(--success)}
.tabs .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:10px 14px}
.drawer.collapsed .drawer-body{display:none}
textarea.yaml{width:100%;height:100%;min-height:170px;resize:none;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre;color:var(--foreground)}
.yaml-wrap{display:grid;grid-template-columns:1fr 200px;gap:10px;height:100%}
.yaml-side{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted-foreground)}
.issues{display:flex;flex-direction:column;gap:6px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer}
.issue:hover{background:var(--accent)}
.issue .who{font-family:var(--mono);font-size:11px;color:var(--muted-foreground);white-space:nowrap;min-width:90px}
.issue.ok{color:var(--success)}
.issue .lv{width:6px;border-radius:3px;flex:none;align-self:stretch}
.issue.error .lv{background:var(--danger)}.issue.warning .lv{background:var(--warning)}.issue.info .lv{background:var(--info)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;font-weight:600;color:var(--muted-foreground);font-size:11px;padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.tbl td.m{font-family:var(--mono);font-size:11px}
.fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fit-grid h3{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;display:flex;align-items:center;gap:8px}
.fit-grid h3 select{height:24px;border:1px solid var(--border);border-radius:6px;background:var(--card);padding:0 6px;font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--foreground)}
.fit-note{font-size:11.5px;color:var(--muted-foreground);margin-top:6px}
/* inspector */
.inspector{border-left:1px solid var(--border);background:var(--card);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.insp-head{display:flex;align-items:center;gap:8px}
.insp-head b{font-size:14px;font-weight:600}
.insp-head .badge{margin-left:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--muted-foreground);font-weight:500;display:flex;align-items:center;gap:6px}
.field label .hint{margin-left:auto;font-weight:400;font-size:10.5px}
.field input,.field select,.field textarea{height:30px;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:0 8px;font-size:12.5px;width:100%}
.field textarea{height:auto;padding:6px 8px;resize:vertical;font-family:var(--mono);font-size:11.5px}
.field input.mono,.field select.mono{font-family:var(--mono);font-size:11.5px}
.field input[readonly]{color:var(--muted-foreground);background:var(--muted)}
.field .help{font-size:11px;color:var(--muted-foreground)}
.field.err input,.field.err select{border-color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.sec-h .sw{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:11px;cursor:pointer;background:var(--muted);font-family:var(--mono);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip.off{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chip .kd{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.exp-row{display:grid;grid-template-columns:1.3fr 0.8fr 0.9fr 24px;gap:4px;align-items:center}
.exp-row select,.exp-row input{height:26px;font-size:11.5px;padding:0 6px}
.exp-row .x{border:none;background:transparent;color:var(--muted-foreground);cursor:pointer;font-size:14px;line-height:1;padding:0;border-radius:4px;height:24px}
.exp-row .x:hover{color:var(--danger);background:var(--danger-soft)}
.res-box{border:1px solid var(--border);border-radius:6px;background:var(--muted);padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.res-box .kv{display:flex;justify-content:space-between;gap:10px}
.res-box .kv span:first-child{color:var(--muted-foreground)}
.res-box .kv span:last-child{font-family:var(--mono);font-size:11px;text-align:right}
.res-box.err{border-color:var(--danger)}
.insp-empty{color:var(--muted-foreground);font-size:12.5px;line-height:1.6}
.insp-empty ul{padding-left:16px;margin:8px 0}
.insp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
.ev-row{display:grid;grid-template-columns:1.4fr 0.6fr 0.6fr 24px;gap:4px;align-items:center}
.ev-row select,.ev-row input{height:26px;font-size:11.5px;padding:0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:8px 14px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

    h += '</table><div class="fit-note">보고서(`/test/results`)의 절차·예상 결과·확인 결과 표와 같은 행 — ptt-test-scenario CSV 형식</div>';
    B.innerHTML = h; }
}

}

    h += `<div class="sec"><div class="sec-h">expect (기대치) <button class="btn sm sw" data-act="addExp">+ 지표</button></div>`;
    for (const k of used) { const v = s.expect[k]; const obj = v && typeof v === 'object'; const th = obj ? Object.keys(v)[0] : (k === 'code' ? '=' : PCT_METRICS.has(k) ? 'min' : 'max'); const val = obj ? v[Object.keys(v)[0]] : v;
      h += `<div class="exp-row"><select class="mono" data-exp="${esc(k)}" data-expf="metric"><optgroup label="이 단계에 맞는 지표">${rel.map(m => `<option value="${m}"${m === k ? ' selected' : ''}>${METRICS[m]}</option>`).join('')}</optgroup><optgroup label="전체">${rest.map(m => `<option value="${m}"${m === k ? ' selected' : ''}>${METRICS[m]}</option>`).join('')}</optgroup></select><select class="mono" data-exp="${esc(k)}" data-expf="th">${['=', 'p50', 'p95', 'p99', 'max', 'min'].map(t => `<option value="${t}"${t === th ? ' selected' : ''}>${t}</option>`).join('')}</select><input class="mono" data-exp="${esc(k)}" data-expf="val" value="${esc(val)}"><button class="x" data-act="rmExp" data-k="${esc(k)}">×</button></div>`; }
    if (!used.length) h += `<div class="help" style="font-size:11px;color:var(--muted-foreground)">없음 — 이 단계에 맞는 지표: ${rel.map(m => `<span class="mono">${m}</span>`).join(', ') || '(없음)'}</div>`;
    h += `<div class="help" style="font-size:11px;color:var(--muted-foreground)">판정은 워커 히스토그램 상한값 근사 — 보수적. 이름은 RFC 6076 그대로</div></div>`;
    h += `<div class="insp-actions"><button class="btn" data-act="dupStep">복제</button><button class="btn" data-act="upStep"${i === 0 ? ' disabled' : ''}>↑</button><button class="btn" data-act="downStep"${i === sc.flow.length - 1 ? ' disabled' : ''}>↓</button><button class="btn danger" data-act="rmStep">삭제</button></div>`;
    I.innerHTML = h; return; }
}

// ───────────────────────── 조작 ─────────────────────────
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function commit() { render(); }
function newStep(kind) { const D = STEPS[kind]; const R = roles(); const s = { step: kind }; const peer = R.find(isPeerRole), ue = R.find(r => !isPeerRole(r));
  if (D.actor === 'who') s.who = [D.kind === 'peer' ? (peer || R[0]) : (ue || R[0])].filter(Boolean);
  if (D.actor === 'from' || D.actor === 'fromto') s.from = D.kind === 'peer' ? (peer || R[0]) : (ue || R[0]);
  if (D.actor === 'fromto' || kind === 'invite') s.to = R.find(r => r !== s.from) || R[0];
  if (['answer', 'reject', 'progress'].includes(kind)) s.after_ms = 500;
  if (D.actor === 'seconds') s.seconds = kind === 'media_hold' ? '${ht}' : 5;
  if (kind === 'dtmf') s.payload = '1234#'; if (kind === 'reject') s.payload = '486';
  if (kind === 'media_send') { const smp = Object.keys((topo().media || {}).samples || {}); if (smp.length) s.sample = smp[0]; }
  if (kind === 'register') s.expect = { code: 200 }; if (kind === 'answer') s.expect = { srd_ms: { p95: 2000 } }; if (kind === 'bye') s.expect = { sdd_ms: { p95: 300 } }; if (kind === 'media_hold') s.expect = { rtp_loss_pct: { max: 0.5 } };
  return s; }
function insertStep(kind, at) { const s = newStep(kind); sc.flow.splice(at, 0, s); sel = { kind: 'step', idx: at }; if (kind === 'media_hold' && !('ht' in bindPreview)) bindPreview.ht = (PROFILES[profileId] || {}).ht ?? 20; commit(); }
function moveStep(from, to) { if (to > from) to--; const [s] = sc.flow.splice(from, 1); sc.flow.splice(to, 0, s); sel = { kind: 'step', idx: to }; commit(); }
function addRole(kind) { const T = topo(); const cand = Object.entries(T.pools).find(([, p]) => p.kind === kind); const logical = cand ? (cand[1].group || cand[0]) : (kind === 'peer' ? 'peer_x' : 'ue_x'); let base = kind === 'peer' ? 'peer' : 'ue'; let n = base, k = 2; while (sc.roles[n]) n = base + k++; sc.roles[n] = { pool: logical }; sel = { kind: 'role', id: n }; commit(); toast(`역할 ${n} 추가 — pool ${logical}`); }
function renameRole(o, n) { if (!n || n === o || sc.roles[n]) return; const R = {}; for (const [k, v] of Object.entries(sc.roles)) R[k === o ? n : k] = v; for (const v of Object.values(R)) if (v.disjoint_from === o) v.disjoint_from = n; sc.roles = R; for (const s of sc.flow) { if (s.who) s.who = s.who.map(x => x === o ? n : x); if (s.from === o) s.from = n; if (s.to === o) s.to = n; } sel = { kind: 'role', id: n }; }
function removeRole(n) { const refs = sc.flow.filter(s => (s.who || []).includes(n) || s.from === n || s.to === n).length; if (refs && !confirm(`역할 ${n} 을 ${refs} 개 단계가 참조합니다. 지울까요? (참조는 비워집니다)`)) return; delete sc.roles[n]; for (const v of Object.values(sc.roles)) if (v.disjoint_from === n) delete v.disjoint_from; for (const s of sc.flow) { if (s.who) s.who = s.who.filter(x => x !== n); if (s.from === n) delete s.from; if (s.to === n) delete s.to; } sel = { kind: 'scenario' }; commit(); }
function reorderRoles(from, to) { const R = roles(); const i = R.indexOf(from), j = R.indexOf(to); if (i < 0 || j < 0 || i === j) return; R.splice(i, 1); R.splice(j, 0, from); const O = {}; for (const k of R) O[k] = sc.roles[k]; sc.roles = O; commit(); }
function loadScenario(id) { scId = id; sc = deep(BUNDLED[id]); orig = JSON.stringify(sc); sel = { kind: 'scenario' }; yamlDirty = false; commit(); }

// 팔레트 드래그
let drag = null;
document.addEventListener('dragstart', e => { if (e.target.closest && e.target.closest('[data-mk]')) { e.preventDefault(); return; } const t = e.target.closest('[draggable="true"]'); if (!t) return;
  if (t.dataset.step) drag = { type: 'newstep', step: t.dataset.step }; else if (t.dataset.role) drag = { type: 'newrole', role: t.dataset.role }; else if (t.dataset.stepIdx != null) { drag = { type: 'move', idx: +t.dataset.stepIdx }; t.classList.add('dragging'); } else if (t.dataset.lane) { drag = { type: 'lane', id: t.dataset.lane }; t.classList.add('dragging'); } else return;
  e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'x'); } catch (_) {} });
document.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.dragging,.drop-hot').forEach(x => x.classList.remove('dragging', 'drop-hot')); });
document.addEventListener('dragover', e => { if (!drag) return; document.querySelectorAll('.drop-hot').forEach(x => x.classList.remove('drop-hot'));
  const hb = e.target.closest('[data-hold]'); if (hb && drag.type === 'newstep' && DURING_OK.has(drag.step)) { e.preventDefault(); hb.classList.add('drop-hot'); return; }
  const g = e.target.closest('[data-gap],[data-laneadd],[data-lane]'); if (!g) return;
  if ((drag.type === 'newstep' || drag.type === 'move') && g.dataset.gap != null) { e.preventDefault(); g.classList.add('drop-hot'); }
  if (drag.type === 'newrole' && g.hasAttribute('data-laneadd')) { e.preventDefault(); g.classList.add('drop-hot'); }
  if (drag.type === 'lane' && g.dataset.lane && g.dataset.lane !== drag.id) { e.preventDefault(); g.classList.add('drop-hot'); } });
document.addEventListener('drop', e => { if (!drag) return;
  const hb = e.target.closest('[data-hold]'); if (hb && drag.type === 'newstep' && DURING_OK.has(drag.step)) { e.preventDefault(); const i = +hb.dataset.hold; const s = sc.flow[i]; const r = hb.getBoundingClientRect(); const len = secondsOf(s) || 1; const at = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * len * 2) / 2; const R = roles(); const d = { at_s: at, step: drag.step, from: STEPS[drag.step].kind === 'peer' ? (R.find(isPeerRole) || R[0]) : R[0] }; if (drag.step === 'dtmf') d.payload = '1234#'; if (drag.step === 'refer') d.to = R.find(x => x !== d.from) || R[0]; if (drag.step === 'media_send') { const smp = Object.keys((topo().media || {}).samples || {}); if (smp.length) d.sample = smp[0]; } s.during = s.during || []; s.during.push(d); sel = { kind: 'sub', idx: i, k: s.during.length - 1 }; drag = null; commit(); return; }
  const g = e.target.closest('[data-gap],[data-laneadd],[data-lane]'); if (!g) return; e.preventDefault();
  if (drag.type === 'newstep' && g.dataset.gap != null) insertStep(drag.step, +g.dataset.gap);
  else if (drag.type === 'move' && g.dataset.gap != null) moveStep(drag.idx, +g.dataset.gap);
  else if (drag.type === 'newrole' && g.hasAttribute('data-laneadd')) addRole(drag.role);
  else if (drag.type === 'lane' && g.dataset.lane) reorderRoles(drag.id, g.dataset.lane);
  drag = null; });

// 팔레트 클릭 = 선택 단계 뒤에(또는 끝에) 삽입 · 그룹 접기
$('#palette').addEventListener('click', e => { const h = e.target.closest('.pal-group h2'); if (h) { h.parentElement.classList.toggle('collapsed'); return; }
  const it = e.target.closest('.pal-item'); if (!it || it.classList.contains('off')) return;
  if (it.dataset.step) insertStep(it.dataset.step, sel.kind === 'step' ? sel.idx + 1 : sc.flow.length); else if (it.dataset.role) addRole(it.dataset.role); });

// during 마커 — 포인터로 끌어 at_s 변경(유지 바 기준), 놓으면 그 동작 선택. 행의 HTML5 드래그와 분리(dragstart 에서 막는다)
let mkDrag = null;
document.addEventListener('pointerdown', e => { const mk = e.target.closest && e.target.closest('[data-mk]'); if (!mk) return; const [i, k] = mk.dataset.mk.split(':').map(Number); const hb = mk.parentElement.querySelector('[data-hold]'); if (!hb) return;
  mkDrag = { i, k, mk, rect: hb.getBoundingClientRect(), len: secondsOf(sc.flow[i]) || 1 }; e.preventDefault(); });
document.addEventListener('pointermove', e => { if (!mkDrag) return; const f = Math.max(0, Math.min(1, (e.clientX - mkDrag.rect.left) / mkDrag.rect.width)); const at = Math.round(f * mkDrag.len * 2) / 2; const d = sc.flow[mkDrag.i].during[mkDrag.k];
  if (at !== d.at_s) { d.at_s = at; mkDrag.mk.style.left = (6 + f * 88) + '%'; const ml = mkDrag.mk.querySelector('.ml'); if (ml) ml.textContent = ml.textContent.replace(/^\+[\d.]+s/, `+${at}s`); } });

$('#drawerBody').addEventListener('click', e => {
  if (e.target.id === 'yamlApply') { try { const d = fromYaml($('#yamlTa').value); sc = d; sel = { kind: 'scenario' }; commit(); toast('YAML 적용 — 캔버스 재구성'); } catch (err) { $('#yamlErr').textContent = err.message; } return; }

  const it = e.target.closest('[data-issue]'); if (it) { const ref = validate()[+it.dataset.issue].ref; if (ref) { sel = ref; commit(); const el = ref.kind === 'step' ? $(`[data-step-idx="${ref.idx}"]`) : ref.kind === 'role' ? $(`[data-lane="${ref.id}"]`) : null; el && el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } } });

// 인스펙터
$('#inspector').addEventListener('change', e => { const t = e.target;
  if (t.dataset.f) { if (t.dataset.f === 'tags') sc.tags = t.value.split(',').map(x => x.trim()).filter(Boolean); else sc[t.dataset.f] = t.value.trim(); commit(); return; }
  if (t.dataset.ev != null) { const ev = sc.target_evidence[+t.dataset.ev]; const f = t.dataset.evf; if (f === 'kind') ev.kind = t.value; else { if (t.value === '') delete ev[f]; else ev[f] = +t.value; } commit(); return; }
  if (t.dataset.rf && sel.kind === 'role') { const r = sc.roles[sel.id]; const f = t.dataset.rf;
    if (f === 'name') renameRole(sel.id, t.value.trim()); else if (f === 'count') { if (t.value === '') delete r.count; else r.count = Math.max(1, +t.value); } else if (f === 'disjoint_from') { if (t.value) r.disjoint_from = t.value; else delete r.disjoint_from; } else r[f] = t.value.trim();
    commit(); return; }
  if (sel.kind === 'sub' && t.dataset.subf) { const d = sc.flow[sel.idx].during[sel.k]; const f = t.dataset.subf;
    if (f === 'at_s') d.at_s = Math.max(0, +t.value); else if (t.value.trim() === '') delete d[f]; else d[f] = t.value.trim();
    if (f === 'step') { if (d.step !== 'dtmf') delete d.payload; else d.payload = d.payload || '1234#'; if (d.step !== 'refer') delete d.to; else d.to = d.to || roles().find(x => x !== d.from); }
    commit(); return; }
  if (sel.kind === 'step' && t.dataset.dur != null) { const d = sc.flow[sel.idx].during[+t.dataset.dur]; const f = t.dataset.durf; if (f === 'at_s') d.at_s = Math.max(0, +t.value); else { d[f] = t.value; if (d.step !== 'dtmf') delete d.payload; else d.payload = d.payload || '1234#'; if (d.step !== 'refer') delete d.to; } commit(); return; }
  if (sel.kind === 'step') { const s = sc.flow[sel.idx];
    if (t.dataset.sf) { const f = t.dataset.sf;
      if (f === 'secmode') { s.seconds = t.value === 'bind' ? '${ht}' : (bindPreview.ht ?? 10); if (t.value === 'bind' && !('ht' in bindPreview)) bindPreview.ht = (PROFILES[profileId] || {}).ht ?? 20; }
      else if (f === 'seconds') { const isBind = typeof s.seconds === 'string' && /^\$\{/.test(s.seconds); s.seconds = isBind ? '${' + t.value.trim() + '}' : (t.value === '' ? '' : +t.value); }
      else if (f === 'audio' || f === 'video' || f === 'rtp') { s.media = s.media || {}; if (t.value) s.media[f] = t.value; else delete s.media[f]; if (!Object.keys(s.media).length) delete s.media; }
      else if (f === 'after_ms') { if (t.value === '') delete s.after_ms; else s.after_ms = +t.value; }
      else if (f === 'cause') { if (t.value === '') delete s.cause; else s.cause = +t.value; }
      else if (f === 'loop') { if (t.value === 'false') s.loop = false; else delete s.loop; }

    if (t.dataset.exp != null) { const k = t.dataset.exp; const f = t.dataset.expf; const cur = s.expect[k]; const obj = cur && typeof cur === 'object'; let th = obj ? Object.keys(cur)[0] : '='; let val = obj ? cur[th] : cur; let key = k;
      if (f === 'metric') key = t.value; if (f === 'th') th = t.value; if (f === 'val') val = t.value === '' ? '' : (isNaN(+t.value) ? t.value : +t.value);
      const E = {}; for (const [kk, vv] of Object.entries(s.expect)) E[kk === k ? key : kk] = kk === k ? (th === '=' ? val : { [th]: val }) : vv; s.expect = E; commit(); return; } } });
$('#inspector').addEventListener('click', e => { const c = e.target.closest('[data-chip]'); if (c && (sel.kind === 'step' || sel.kind === 'sub')) { if (c.classList.contains('off')) { toast('이 단계의 행위자가 될 수 없는 풀 kind'); return; } const s = sel.kind === 'sub' ? sc.flow[sel.idx].during[sel.k] : sc.flow[sel.idx]; const name = c.closest('[data-chips]').dataset.chips; const v = c.dataset.chip;
    if (name === 'who') { s.who = s.who || []; s.who = s.who.includes(v) ? s.who.filter(x => x !== v) : [...s.who, v]; } else { if (v) s[name] = v; else delete s[name]; } commit(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
  if (act === 'rmRole') removeRole(sel.id);
  if (act === 'addDur' && sel.kind === 'step') { const s = sc.flow[sel.idx]; s.during = s.during || []; const R = roles(); s.during.push({ at_s: Math.round(secondsOf(s) / 2), step: 'dtmf', from: R.find(isPeerRole) || R[0], payload: '1234#' }); sel = { kind: 'sub', idx: sel.idx, k: s.during.length - 1 }; commit(); return; }
  if (act === 'rmDur' && sel.kind === 'step') { sc.flow[sel.idx].during.splice(+a.dataset.k, 1); commit(); return; }
  if (act === 'toStep' && sel.kind === 'sub') { sel = { kind: 'step', idx: sel.idx }; commit(); return; }
  if (act === 'rmSub' && sel.kind === 'sub') { sc.flow[sel.idx].during.splice(sel.k, 1); sel = { kind: 'step', idx: sel.idx }; commit(); return; }
  if (act === 'addEv') { sc.target_evidence = sc.target_evidence || []; sc.target_evidence.push({ kind: 'log_errors', max: 0 }); commit(); }
  if (act === 'rmEv') { sc.target_evidence.splice(+a.dataset.k, 1); commit(); }
  if (sel.kind === 'step') { const i = sel.idx; const s = sc.flow[i];

    if (act === 'dupStep') { sc.flow.splice(i + 1, 0, deep(s)); sel = { kind: 'step', idx: i + 1 }; commit(); }

    if (act === 'rmExp') { delete s.expect[a.dataset.k]; commit(); } } });

// 툴바

$('#revertBtn').addEventListener('click', () => { if (BUNDLED[scId]) loadScenario(scId); else { sc = JSON.parse(orig || JSON.stringify(sc)); commit(); } toast('되돌림'); });

document.addEventListener('keydown', e => { if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'Escape') { sel = { kind: 'scenario' }; commit(); }
  if (e.key === 'Delete' && sel.kind === 'step') { sc.flow.splice(sel.idx, 1); sel = { kind: 'scenario' }; commit(); }
  if (e.key === 'Delete' && sel.kind === 'role') removeRole(sel.id);

window.addEventListener('message', e => { if (e.data && typeof e.data === 'object' && 'theme' in e.data) { const t = e.data.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; } });
