<title>계측기 결과 보고서</title>
<style>
:root{
  --background:#f4f6fb; --foreground:#161a2b; --card:#ffffff; --muted:#f8fafc; --muted-foreground:#64748b;
  --secondary:#eef1f7; --secondary-foreground:#475569; --accent:#f2f6fe; --border:#e5e8f1;
  --primary:#4f46e5; --primary-foreground:#fff; --ring:#4f46e5;
  --success:#15803d; --success-soft:#dcfce7; --warning:#b45309; --warning-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2; --info:#0369a1; --info-soft:#e0f2fe;
  --grid:#e5e8f1; --shadow:0 1px 2px rgba(22,26,43,.06),0 4px 14px rgba(22,26,43,.06);
  --chart-1:#0ea5e9; --chart-2:#f59e0b; --chart-3:#7c3aed; --chart-4:#14b8a6; --chart-5:#ec4899; --chart-6:#4f46e5; --chart-7:#65a30d; --chart-8:#ea580c;
  --radius:8px; --radius-lg:14px;
  --sans:'Pretendard Variable',Pretendard,'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --background:#0b0f17; --foreground:#e6e9f1; --card:#151c2b; --muted:#111827; --muted-foreground:#93a1b8;
  --secondary:#1d2636; --secondary-foreground:#93a1b8; --accent:#1b2435; --border:#2a3346;
  --primary:#6366f1; --ring:#6366f1;
  --success:#4ade80; --success-soft:#14532d; --warning:#fbbf24; --warning-soft:#451a03; --danger:#f87171; --danger-soft:#450a0a; --info:#38bdf8; --info-soft:#0c4a6e;
  --grid:#1d2636; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --chart-1:#38bdf8; --chart-2:#fbbf24; --chart-3:#a78bfa; --chart-4:#2dd4bf; --chart-5:#f472b6; --chart-6:#818cf8; --chart-7:#a3e635; --chart-8:#fb923c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --background:#0b0f17; --foreground:#e6e9f1; --card:#151c2b; --muted:#111827; --muted-foreground:#93a1b8;
  --secondary:#1d2636; --secondary-foreground:#93a1b8; --accent:#1b2435; --border:#2a3346;
  --primary:#6366f1; --ring:#6366f1;
  --success:#4ade80; --success-soft:#14532d; --warning:#fbbf24; --warning-soft:#451a03; --danger:#f87171; --danger-soft:#450a0a; --info:#38bdf8; --info-soft:#0c4a6e;
  --grid:#1d2636; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --chart-1:#38bdf8; --chart-2:#fbbf24; --chart-3:#a78bfa; --chart-4:#2dd4bf; --chart-5:#f472b6; --chart-6:#818cf8; --chart-7:#a3e635; --chart-8:#fb923c;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;min-height:640px}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--muted);flex-wrap:wrap}
.toolbar h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.toolbar .sub{color:var(--muted-foreground);font-size:12px}
.toolbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.sel,input.inp{height:30px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:0 8px;font-size:12.5px}
select.sel.sm,input.inp.sm{height:26px;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.badge.neutral{background:var(--secondary);color:var(--secondary-foreground)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.brand{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.badge.prop{border:1px dashed var(--warning);color:var(--warning);background:transparent}
.mono{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted-foreground);vertical-align:middle;margin-right:5px}
.dot.ok{background:var(--success)}.dot.err{background:var(--danger)}.dot.warn{background:var(--warning)}.dot.info{background:var(--info)}
.page{flex:1;min-height:0;overflow:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.sec-h{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;display:flex;align-items:center;gap:8px}
.sec-h .r{margin-left:auto;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;font-weight:600;color:var(--muted-foreground);font-size:11px;padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl td.r,table.tbl td.m{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
table.tbl tr.link{cursor:pointer}
table.tbl tr.link:hover td{background:var(--accent)}
table.tbl tr.sel td{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;background:var(--muted);min-width:0;position:relative}
.kpi .l{font-size:11px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:19px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.kpi .s{font-size:11px;color:var(--muted-foreground);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warn .v{color:var(--warning)}.kpi.err .v{color:var(--danger)}
.kpi .tgt{position:absolute;right:8px;top:8px;font-size:10.5px;font-family:var(--mono);color:var(--muted-foreground)}
.kpi .tgt.ok{color:var(--success)}.kpi .tgt.bad{color:var(--danger)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.chart{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px 6px;background:var(--card);min-width:0}
.chart .ch{display:flex;align-items:baseline;gap:8px;font-size:11.5px;margin-bottom:4px}
.chart .ch b{font-weight:600}
.chart .ch .cur{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chart .ch .th{font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground)}
.chart svg{width:100%;height:auto;display:block}
.chart .lg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted-foreground);margin-top:2px}
.chart .lg i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--border);background:var(--muted);font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:8px 14px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:80vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);width:min(720px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.modal .mh .badge{margin-left:auto}
.modal .mb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--muted-foreground);font-weight:500}
.field .help{font-size:11px;color:var(--muted-foreground)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .2s;z-index:55;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600}
.drawer .dh .x{margin-left:auto}
.drawer .db{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ladder{font-family:var(--mono);font-size:11px;display:grid;grid-template-columns:52px 1fr;gap:0 8px;row-gap:3px}
.ladder .t{color:var(--muted-foreground);text-align:right}
.ladder .m{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ladder .m .a{flex:1;border-top:1px solid var(--foreground);position:relative;min-width:40px}
.ladder .m .a::after{content:"";position:absolute;right:-1px;top:-4px;border:4px solid transparent;border-left-color:var(--foreground)}
.ladder .m.rev .a::after{right:auto;left:-1px;border-left-color:transparent;border-right-color:var(--foreground)}
.ladder .m.err{color:var(--danger)}.ladder .m.err .a{border-color:var(--danger)}.ladder .m.err .a::after{border-left-color:var(--danger)}
.ladder .m.err.rev .a::after{border-left-color:transparent;border-right-color:var(--danger)}
pre.sip{margin:0;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-family:var(--mono);font-size:10.5px;line-height:1.4;overflow:auto;max-height:260px;white-space:pre}
.note{font-size:11.5px;color:var(--muted-foreground);line-height:1.5}
.note b{color:var(--foreground)}
.bar{height:6px;border-radius:3px;background:var(--secondary);position:relative;overflow:hidden;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:3px}
.bar i.ok{background:var(--success)}.bar i.bad{background:var(--danger)}.bar i.warn{background:var(--warning)}
.bar .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--foreground);opacity:.6}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.main{flex:1;min-height:0;display:grid;grid-template-columns:272px minmax(0,1fr)}
@media (max-width:900px){.main{grid-template-columns:1fr}.rail{display:none}}
.rail{border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;min-height:0}
.rail .rf{padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.rail .rl{flex:1;overflow:auto}
.rail .day{position:sticky;top:0;background:var(--muted);color:var(--muted-foreground);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:4px 12px;border-bottom:1px solid var(--border)}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:7px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:11.5px}
.rrow:hover{background:var(--accent)}
.rrow.sel{background:color-mix(in srgb,var(--primary) 9%,transparent);box-shadow:inset 3px 0 0 var(--primary)}
.rrow .v{grid-row:1/3;align-self:center}
.rrow .v .dot{margin:0}
.rrow b{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow small{color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep{flex:1;min-height:0;overflow:auto;padding:14px 18px 60px;display:flex;flex-direction:column;gap:14px}
.subnav{position:sticky;top:0;z-index:3;display:flex;gap:2px;background:var(--background);padding:0 0 6px;margin:-4px 0 0;border-bottom:1px solid var(--border);font-size:12px;overflow-x:auto}
.subnav a{padding:6px 10px;color:var(--muted-foreground);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.subnav a:hover{color:var(--foreground)}
.subnav a.on{color:var(--primary);border-bottom-color:var(--primary)}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 16px;align-items:start;padding:14px 16px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--card);border-left:5px solid var(--vc)}
.verdict .big{font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--vc);line-height:1;font-family:var(--mono)}
.verdict .big small{display:block;font-size:11px;font-weight:500;color:var(--muted-foreground);letter-spacing:.04em;margin-top:6px;font-family:var(--sans)}
.verdict .ttl{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.verdict .why{margin-top:6px;font-size:12.5px;line-height:1.5}
.verdict .why b{color:var(--vc)}
.verdict .metas{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11.5px;color:var(--muted-foreground)}
.verdict .metas .mono{color:var(--foreground)}
.verdict .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.evid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ev{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;background:var(--muted);font-size:11.5px;display:flex;gap:8px;align-items:center}
.ev .badge{margin-left:auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.charts.rep-charts{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.alarm-lane{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;background:var(--card)}
.alarm-lane .ch{display:flex;gap:8px;font-size:11.5px;margin-bottom:4px;align-items:center}
.lat tr.h{cursor:pointer}
.lat tr.h:hover td{background:var(--accent)}
.lat tr.hist td{padding:6px 8px 10px;background:var(--muted)}
.lat .hist svg{width:100%;height:auto}
.proc td .bar{width:110px;display:inline-block;vertical-align:middle;margin-right:6px}
.proc td.exp{font-family:var(--mono);font-size:11px;color:var(--muted-foreground)}
.proc tr.fail td{background:color-mix(in srgb,var(--danger) 6%,transparent)}
.codes .badge{font-family:var(--mono)}
.steplog td .bar{width:120px;display:inline-block;vertical-align:middle;margin-right:6px}
.evtbl tr.link:hover td{background:var(--accent)}
.md{background:var(--muted);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;max-height:220px;overflow:auto}
@media print{.toolbar,.rail,.subnav,.acts,.no-print,.toast{display:none!important}.main{display:block}.rep{overflow:visible;padding:0}.card,.verdict{break-inside:avoid;border-color:#bbb}}
</style>
<div class="app">
<div class="toolbar">
  <h1>결과</h1>
  <span class="sub">run 하나의 보고서 — 왼콽 목록에서 고르거나 실행 색인에서 넘어온다</span>
  <div class="right">
    <button class="btn" id="prevBtn" title="목록에서 이전 run">↑ 이전</button><button class="btn" id="nextBtn" title="목록에서 다음 run">↓ 다음</button>
    <button class="btn" data-act="compare">⇄ 비교에 담기</button>
    <button class="btn" data-act="rerun">↻ 재실행</button>
    <button class="btn" data-act="md">Markdown</button>
    <button class="btn" data-act="print">🖨 인쇄</button>
    <button class="btn danger" data-act="del">삭제</button>
  </div>
</div>
<div class="main">
  <aside class="rail">
    <div class="rf"><input class="inp sm" id="rq" placeholder="라벨 · 시나리오 · id 검색"><div class="chips" id="rv"><span class="chip on" data-v="">전체</span><span class="chip" data-v="fail">FAIL</span><span class="chip" data-v="pass">PASS</span><span class="chip" data-v="load">부하</span></div></div>
    <div class="rl" id="rail"></div>
  </aside>
  <div class="rep" id="rep">
    <nav class="subnav" id="subnav"><a data-s="s-verdict" class="on">판정</a><a data-s="s-time">시간축</a><a data-s="s-metric">지표</a><a data-s="s-proc">절차</a><a data-s="s-fail">실패</a><a data-s="s-step">단계 로그</a><a data-s="s-evid">대상 증거</a><a data-s="s-md">Markdown</a></nav>
    <div id="body"></div>
  </div>
</div>
<div class="drawer" id="sipDr"><div class="dh"><span>SIP 사다리</span><span class="mono" id="sipCid"></span><button class="btn sm ghost x" id="sipX">✕</button></div><div class="db" id="sipBody"></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
// ── 공통: 모의 데이터 · 시계열 합성 · SVG 차트 · 토스트 · 테마 ─────────────────────────────
const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return (s % 100000) / 100000; }; }
const fmt = {
  n: (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }),
  pct: v => v == null ? '—' : v.toFixed(2) + ' %', ms: v => v == null ? '—' : Math.round(v) + ' ms',
  dur: s => s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`,
  hms: t => { const d = new Date(t * 1000); const p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; },
  dt: iso => iso.replace('T', ' ').slice(0, 16), day: iso => iso.slice(0, 10),
};
const VERDICT = { running: ['info', '진행 중'], pass: ['ok', 'PASS'], fail: ['err', 'FAIL'], aborted: ['warn', '중단'], error: ['err', '오류'] };
const vbadge = v => `<span class="badge ${VERDICT[v][0]}">${VERDICT[v][1]}</span>`;
const SCEN = {
  'VOLTE-CALL-BASIC': { title: 'VoLTE 1:1 발착신 (AMR-WB + H.264)', tags: ['volte'], roles: { caller: 'volte_ue', callee: 'volte_ue' },

document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; const r = runById(cur); const act = a.dataset.act;
  if (act === 'compare') { const prev = DONE.find(x => x.scenario === r.scenario && x.profile === r.profile && x.build !== r.build && x.id !== r.id); toast(prev ? `/test/compare?ids=${prev.id},${r.id} — 같은 시나리오·프로파일의 직전 빌드 run 을 기준으로 (목업)` : '같은 조건의 다른 빌드 run 없음 — 비교 화면에서 직접 고르십시오'); }
  else if (act === 'rerun') toast(`run 시작 창 열기 — ${r.scenario} · ${r.topology} · ${r.profile || '단발'} 미리 채움 (목업)`); else if (act === 'md') toast('Markdown 복사 (컨트롤러 report_markdown)'); else if (act === 'print') window.print(); else if (act === 'del') { if (confirm(`${r.id} 의 색인·지표·이벤트·SIP 덤프를 지웁니다. 되돌릴 수 없습니다.`)) toast('DELETE /runs/{id} (목업)'); } else if (act === 'scen') toast(`/test/scenarios?id=${r.scenario} — 시나리오 캔버스 (목업)`); });
$('#subnav').addEventListener('click', e => { const a = e.target.closest('a[data-s]'); if (!a) return; const el = $('#' + a.dataset.s); if (!el) { toast('이 run 에는 해당 구획이 없음'); return; } $$('#subnav a').forEach(x => x.classList.toggle('on', x === a)); el.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
$('#rep').addEventListener('scroll', () => { const secs = $$('#body > section'); let on = secs[0]; secs.forEach(s => { if (s.getBoundingClientRect().top - $('#rep').getBoundingClientRect().top < 60) on = s; }); $$('#subnav a').forEach(a => a.classList.toggle('on', on && a.dataset.s === on.id)); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#sipDr').classList.remove('show'); });
renderRail(); renderReport();
</script>
