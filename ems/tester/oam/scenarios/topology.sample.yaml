# 토폴로지 — 대상(SUT)·워커·풀. 콘솔 [시험 > 토폴로지] 가 편집·저장하는 레코드의 YAML 표현.
# 비밀(토큰·H(A1))은 YAML 에 두지 않고 환경변수 이름만 적는다.
name: media01
target:
  name: media01
  csp: { ip: 10.0.0.45, udp: 5060, tcp: 25061, tls: 5061, domain_volte: volte.cims.example.kr, domain_ptt: ptt.cims.example.kr,
         peering: { port: 5070, protocol: udp, local_node: cims-tester-peering } }   # 피어 풀의 다음 홉 — 없으면 시드(edge=peering)
  csc: { host: 10.0.0.45, port: 4430, tls: true }
  oam: { url: https://10.0.0.45:4419, token_env: TESTER_OAM_TOKEN }
  observe: [oam_stats, oam_alarms, agent_heartbeat]
workers:
  - { name: w1, url: http://10.0.0.61:7100, cpus: 8 }
  - { name: w2, url: http://10.0.0.62:7100, cpus: 8 }
pools:
  volte_ue:
    kind: ue
    source: { db: target, table: volte_subscriptions, offset: 0, count: 2000 }
    transport: tls
    srtp: optional
    prack: true                 # 100rel — MGCF 183 early media 시험(TRUNK-MGCF-OUTBOUND)의 전제
  ptt_ue:
    kind: ue
    source: { creds: creds/ptt.jsonl }
    transport: udp
  peer_kt:                      # 타 IMS 코어 — 워커 w2 호스트에 수신점. 시드 = remote_node/route/rule/routing_policy(자동)
    kind: peer
    profile: ibcf
    bind: { ip: 10.0.0.62, port: 5080, protocol: udp }
    domain: ims.kt.test
    identities: { e164_range: ["+82212340000", "+82212349999"], count: 200 }
    seed: { route_set: rs-kt, priority: 100 }
  peer_kt_dead:                 # 같은 RouteSet 의 우선 피어 — 무응답(failover 시험, TRUNK-IBCF-FAILOVER)
    kind: peer
    profile: ibcf
    bind: { ip: 10.0.0.62, port: 5081, protocol: udp }
    domain: ims.kt.test
    identities: { e164_range: ["+82212340000", "+82212340009"] }
    answer: silent
    seed: { route_set: rs-kt, priority: 50 }
  peer_blocked:                 # ACL deny 대상 피어 (TRUNK-IBCF-ACL-DENY)
    kind: peer
    profile: ibcf
    bind: { ip: 10.0.0.62, port: 5082, protocol: udp }
    domain: ims.blocked.test
    identities: { e164_range: ["+82299990000", "+82299990009"] }
    seed: { acl: deny }
  pbx_hq:                       # IP-PBX — G.711 + telephone-event, 등록형 트렁크 계정(SIPconnect 2.0). UE 는 DID 를 그대로 다이얼(prefix 규칙)
    kind: peer
    profile: pbx
    bind: { ip: 10.0.0.62, port: 5090, protocol: udp }
    domain: pbx.hq.test
    register: { user: pbx-hq, ha1_env: PBX_HA1 }
    identities: { did_range: ["0212345000", "0212345099"], ext_len: 4 }
    codecs: [PCMA, PCMU]
  mgcf_pstn:                    # MGCF(IM-MGW 가 AMR-WB 오퍼) — E.164 만, 183 early media + 100rel, Q.850 Reason
    kind: peer
    profile: mgcf
    bind: { ip: 10.0.0.62, port: 5095, protocol: udp }
    domain: mgcf.pstn.test
    identities: { e164_range: ["+82312340000", "+82312340099"] }
