# 노드별 발신 — 접속점 udp 가입자 → 피어 pbx_hq(pbx). 시드된 routing_policy → RouteSet → 피어링 접속점 송신, 가입자가 종료.
id: NODE-PEEROUT-UDP-PBXHQ
title: 피어 발신 udp → pbx_hq
tags: [node, trunk, pbx, udp]
roles:
  caller: { pool: volte_ue }
  peer:   { pool: pbx_hq }
flow:
  - { step: register,   who: [caller], expect: { code: 200 } }
  - { step: invite,     from: caller, to: peer, media: { audio: amr-wb } }
  - { step: answer,     who: [peer], after_ms: 800, expect: { code: 200, srd_ms: { p95: 2000 } } }
  - { step: media_hold, seconds: 3, expect: { rtp_loss_pct: { max: 0.5 } } }
  - { step: bye,        from: caller, expect: { sdd_ms: { p95: 300 } } }
