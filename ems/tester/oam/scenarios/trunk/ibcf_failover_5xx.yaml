# IBCF 피어 5xx failover — RouteSet(failover) 의 우선 피어(peer_kt_503, answer=reject 503)가 즉시 503 을 내면 다음 피어(peer_kt)로 넘어가는가
#   (무응답 Timer B 가 아닌 최종 응답 기반 failover — RFC 3263 §4.3 / TS 24.229 §5.10 IBCF 라우팅 실패 처리). 두 풀은 같은 seed.route_set.
#   bad 역할은 흐름에 없지만 선언해야 그 풀이(거절 정책으로) 열린다. peer_fault_reject 카운터가 우선 피어가 실제로 골라졌음을 증명한다.
#   대상이 503 을 발신자에게 그대로(또는 603 으로) 넘기면 실패 = test_instrument.md §12 항목.
id: TRUNK-IBCF-FAILOVER-5XX
title: IBCF 피어 5xx failover (우선 피어 503 → 다음 피어)
tags: [trunk, ibcf, failover, fault]
roles:
  caller: { pool: volte_ue }
  peer:   { pool: peer_kt }
  bad:    { pool: peer_kt_503 }
flow:
  - { step: register,   who: [caller], expect: { code: 200 } }
  - { step: invite,     from: caller, to: peer, media: { audio: amr-wb } }
  - { step: answer,     who: [peer], after_ms: 500, expect: { code: 200, srd_ms: { p95: 3000 } } }
  - { step: bye,        from: caller, expect: { sdd_ms: { p95: 300 } } }
