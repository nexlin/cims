# IP-PBX 측 blind REFER(RFC 3515) — 가입자 → PBX 통화를 PBX 가 다른 가입자(xfer_to)로 전달. CSP(B2BUA)가 REFER 를 종단(202)하고
# xfer_to 에 INVITE 를 낸 뒤 PBX leg 를 BYE 로 접는다(volte_supplementary_services.md §6.1 과 같은 경로 — 전달자가 피어 leg).
id: TRUNK-PBX-TRANSFER
title: IP-PBX blind REFER → 가입자 전달
tags: [trunk, pbx, transfer]
roles:
  caller:  { pool: volte_ue }
  xfer_to: { pool: volte_ue, disjoint_from: caller }
  pbx:     { pool: pbx_hq }
flow:
  - { step: register,   who: [caller, xfer_to], expect: { code: 200 } }
  - { step: invite,     from: caller, to: pbx, media: { audio: pcmu } }
  - { step: answer,     who: [pbx], after_ms: 500, expect: { code: 200 } }
  - { step: media_hold, seconds: 2 }
  - { step: refer,      from: pbx, to: xfer_to, expect: { code: 202 } }
  - { step: answer,     who: [xfer_to], after_ms: 500 }
  - { step: media_hold, seconds: 3, expect: { rtp_loss_pct: { max: 0.5 } } }
  - { step: bye,        from: caller, expect: { sdd_ms: { p95: 300 } } }
