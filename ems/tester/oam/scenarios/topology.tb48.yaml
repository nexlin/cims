# tb48 검증 토폴로지 — 콘솔 [시험 > 토폴로지] 레코드 #2 의 YAML 표현(소스 관리본). 피어(ibcf/pbx/mgcf)·등록형 트렁크·VoIP/TLS 풀 포함. 비밀은 환경변수 이름만.
# 피어 라우팅은 대상 CSP(dep34)에 사이트 설정으로 영구 배치(tb48-* 레코드, 피어링 접속점 tb48-peering) — 풀 seed.enabled=false 라 계측기는 시드하지 않고 그 설정을 검증한다.
name: tb48
hosts:
  h48:
    name: media01
    ip: 121.161.164.48
  h45:
    name: db45
    ip: 121.161.164.45
workers:
- name: w1
  host: h48
  port: 7100
  cpus: 4
target:
  name: tb48
  kind: cims
  nodes:
    csp:
      role: sip
      host: h48
      fn: CSP
      procs:
      - csp
      logs:
      - /home/cims/work/cims/build/dist/mgmt-server/csp/current/csp/log/csp_*.log
      sip:
        domains:
        - volte.cims.example.kr
        - ptt.cims.example.kr
        - voip.cims.example.kr
        listeners:
          udp:
            edge: access
            port: 15060
            protocol: udp
            local_node: access-udp
          tcp:
            edge: access
            port: 15060
            protocol: tcp
            local_node: access-tcp
          tls:
            edge: access
            port: 15061
            protocol: tls
            local_node: access-tls
          peering:
            edge: peering
            port: 15070
            protocol: udp
            local_node: tb48-peering
        dial_plan:
          country_code: '82'
          national_prefix: '0'
          international_prefix: '00'
    cmp:
      role: media
      host: h48
      fn: CMP
      procs:
      - cmp
      logs: []
      media:
        rtp_range:
        - 50000
        - 50039
        control: 9001
    csc:
      role: subscriber
      host: h48
      fn: CSC
      procs:
      - csc
      logs: []
      api:
        port: 4430
        tls: true
    oam:
      role: oam
      host: h48
      fn: OAM
      procs:
      - oam
      logs: []
      oam:
        port: 4419
        tls: true
        token_env: TESTER_OAM_TOKEN
        csp_deployment_id: 34
        observe:
        - oam_stats
        - oam_alarms
        - agent_heartbeat
    db:
      role: db
      host: h45
      fn: MariaDB
      procs: []
      logs: []
      db:
        port: 3306
        name: cims
        user_env: TESTER_DB_USER
        password_env: TESTER_DB_PASS
pools:
  volte_ue:
    worker: w1
    kind: ue
    access: csp
    source:
      creds: creds/volte.jsonl
      offset: 0
      count: 30                 # 31~34 번째 신원은 volte_ue_tcp, 35~40 번째는 volte_ue_cw(통화중대기 단말) 풀
    transport: udp
    srtp: 'off'
    register_expires: 3600
    prack: false
    dtmf: rfc4733
    tls_verify: false
    tls_client_cert: false
    msrp: false
  volte_ue_tcp:                # TCP 접속점(access-tcp) 가입자 — 노드별 착/발신 매트릭스(NODE-CALL-*)의 tcp 축
    worker: w1
    kind: ue
    access: csp
    listener: tcp
    source:
      creds: creds/volte.jsonl
      offset: 30
      count: 4
    transport: tcp
    srtp: 'off'
    register_expires: 3600
    prack: false
    dtmf: rfc4733
  volte_ue_cw:                 # 통화중대기 단말(TS 24.615) — 통화 중 두 번째 착신을 180 으로 보류(VOLTE-ANN-CALL-WAITING 의 착신)
    worker: w1
    kind: ue
    access: csp
    source:
      creds: creds/volte.jsonl
      offset: 34
      count: 6
    transport: udp
    srtp: 'off'
    register_expires: 3600
    prack: false
    dtmf: rfc4733
    call_waiting: true
  volte_ue_tls:
    worker: w1
    kind: ue
    access: csp
    listener: tls
    source:
      creds: creds/volte_tls.jsonl
      offset: 0
    transport: tls
    srtp: 'off'
    register_expires: 3600
    prack: false
    dtmf: rfc4733
    tls_verify: false
    tls_client_cert: false
    msrp: false
  voip_ue:
    worker: w1
    kind: ue
    access: csp
    listener: tls
    source:
      creds: creds/voip.jsonl
      offset: 0
    service: voip
    transport: tls
    srtp: 'off'
    register_expires: 3600
    prack: false
    dtmf: rfc4733
    tls_verify: false
    tls_client_cert: false
    msrp: false
  ptt_ue:
    worker: w1
    kind: ue
    access: csp
    source:
      creds: creds/ptt.jsonl
      offset: 0
    service: ptt
    transport: udp
    srtp: 'off'
    register_expires: 3600
    prack: false
    dtmf: rfc4733
    tls_verify: false
    tls_client_cert: false
    msrp: true
    subscriber: csc
  pbx_hq:
    worker: w1
    kind: peer
    peering: csp
    profile: pbx
    bind:
      port: 5090
      protocol: udp
    domain: pbx.hq.test
    identities:
      did_range:
      - '+82210001010'
      - '+82210001014'
      ext_len: 4
    codecs:
    - PCMA
    - PCMU
    answer: normal
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    dial_plan:
      country_code: '82'
      national_prefix: '0'
      international_prefix: '00'
    seed:
      enabled: false
      distribution: failover
      priority: 100
      weight: 1
  pbx_reg:
    worker: w1
    kind: peer
    peering: csp
    profile: pbx
    bind:
      port: 5091
      protocol: udp
    domain: pbx.reg.test
    identities:
      did_range:
      - '+82210001015'
      - '+82210001019'
      ext_len: 4
    register:
      user: pbx-hq
      ha1_env: PBX_HA1
      expires: 3600
    codecs:
    - PCMA
    - PCMU
    answer: normal
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    seed:
      enabled: false
      distribution: failover
      priority: 100
      weight: 1
  mgcf_pstn:
    worker: w1
    kind: peer
    peering: csp
    profile: mgcf
    bind:
      port: 5095
      protocol: udp
    domain: mgcf.pstn.test
    identities:
      e164_range:
      - '+82220001010'
      - '+82220001019'
    answer: normal
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    seed:
      enabled: false
      distribution: failover
      priority: 100
      weight: 1
  peer_kt:
    worker: w1
    kind: peer
    peering: csp
    profile: ibcf
    bind:
      port: 5080
      protocol: udp
    domain: ims.kt.test
    identities:
      e164_range:
      - '+821010001000'
      - '+821010001009'
    answer: normal
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    seed:
      enabled: false
      route_set: rs-kt
      distribution: failover
      priority: 100
      weight: 1
  peer_kt_dead:
    worker: w1
    kind: peer
    peering: csp
    profile: ibcf
    bind:
      port: 5081
      protocol: udp
    domain: ims.kt.test
    identities:
      e164_range:
      - '+821010001000'
      - '+821010001009'
    answer: silent
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    seed:
      enabled: false
      route_set: rs-kt
      distribution: failover
      priority: 50
      weight: 1
  peer_kt_503:
    worker: w1
    kind: peer
    peering: csp
    profile: ibcf
    bind:
      port: 5083
      protocol: udp
    domain: ims.kt.test
    identities:
      e164_range:
      - '+821010001000'
      - '+821010001009'
    answer: reject
    fault:
      code: 503
      q850: 38
      delay_ms: 0
      drop_invite: 0
      drop_pct: 0
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    seed:
      enabled: false
      route_set: rs-kt
      distribution: failover
      priority: 40
      weight: 1
  peer_blocked:
    worker: w1
    kind: peer
    peering: csp
    profile: ibcf
    bind:
      port: 5082
      protocol: udp
    domain: ims.blocked.test
    identities:
      e164_range:
      - '+821010001000'
      - '+821010001009'
    answer: normal
    dtmf: rfc4733
    thig: false
    tls_client_auth: false
    tls_verify: false
    tls_client_cert: false
    seed:
      enabled: false
      distribution: failover
      priority: 100
      weight: 1
      acl: deny
media:
  samples:
    ringback:     { pcmu: ringback_kr.pcmu, pcma: ringback_kr.pcma, g722: ringback_kr.g722, amr-wb: ringback_kr.amrwb }
    dial:         { pcmu: dial_kr.pcmu, pcma: dial_kr.pcma, g722: dial_kr.g722, amr-wb: dial_kr.amrwb }
    busy:         { pcmu: busy_kr.pcmu, pcma: busy_kr.pcma, g722: busy_kr.g722, amr-wb: busy_kr.amrwb }
    congestion:   { pcmu: congestion_kr.pcmu, pcma: congestion_kr.pcma, g722: congestion_kr.g722, amr-wb: congestion_kr.amrwb }
    call_waiting: { pcmu: call_waiting_kr.pcmu, pcma: call_waiting_kr.pcma, g722: call_waiting_kr.g722, amr-wb: call_waiting_kr.amrwb }
    tone_1k:      { pcmu: tone_1k.pcmu, pcma: tone_1k.pcma, g722: tone_1k.g722, amr-wb: tone_1k.amrwb }
    moh:          { pcmu: moh_simple.pcmu, pcma: moh_simple.pcma, g722: moh_simple.g722, amr-wb: moh_simple.amrwb }
    ann_connecting:     { pcmu: ann_connecting.pcmu, pcma: ann_connecting.pcma, g722: ann_connecting.g722, amr-wb: ann_connecting.amrwb }
    ann_hold:           { pcmu: ann_hold.pcmu, pcma: ann_hold.pcma, g722: ann_hold.g722, amr-wb: ann_hold.amrwb }
    ann_call_waiting:   { pcmu: ann_call_waiting.pcmu, pcma: ann_call_waiting.pcma, g722: ann_call_waiting.g722, amr-wb: ann_call_waiting.amrwb }
    ann_busy:           { pcmu: ann_busy.pcmu, pcma: ann_busy.pcma, g722: ann_busy.g722, amr-wb: ann_busy.amrwb }
    ann_no_answer:      { pcmu: ann_no_answer.pcmu, pcma: ann_no_answer.pcma, g722: ann_no_answer.g722, amr-wb: ann_no_answer.amrwb }
    ann_invalid_number: { pcmu: ann_invalid_number.pcmu, pcma: ann_invalid_number.pcma, g722: ann_invalid_number.g722, amr-wb: ann_invalid_number.amrwb }
    voice:        { amr-wb: sample_voice.amrwb }                                   # 15 s 연속 음성(워커 Media.AudioFile 기본)
    speech_act40: { pcmu: speech_act40_kr.pcmu, g722: speech_act40_kr.g722, amr-wb: speech_act40_kr.amrwb }        # P.59 표 1 활동률 38.5 %
    speech_act40_dtx: { amr-wb: speech_act40_kr_dtx.amrwb }                          # 같은 원음, AMR-WB DTX(SID·NO_DATA 무송신)
    speech_act50: { pcmu: speech_act50_kr.pcmu, g722: speech_act50_kr.g722, amr-wb: speech_act50_kr.amrwb }        # 활동률 50 %
    speech_act50_dtx: { amr-wb: speech_act50_kr_dtx.amrwb }
    speech_act100: { pcmu: speech_act100_kr.pcmu, g722: speech_act100_kr.g722, amr-wb: speech_act100_kr.amrwb }    # 문장 연속(DTX 이득 없음)
    speech_act100_dtx: { amr-wb: speech_act100_kr_dtx.amrwb }
    conv_a:       { pcmu: conv_p59_a.pcmu, g722: conv_p59_a.g722, amr-wb: conv_p59_a.amrwb }                       # P.59 §3 대화 A 측(발신자)
    conv_b:       { pcmu: conv_p59_b.pcmu, g722: conv_p59_b.g722, amr-wb: conv_p59_b.amrwb }                       # 같은 시간축의 B 측(착신자)
    conv_a_dtx:   { amr-wb: conv_p59_a_dtx.amrwb }
    conv_b_dtx:   { amr-wb: conv_p59_b_dtx.amrwb }
layout:
