# 무응답 착신전환 CFNR(TS 24.604, volte_supplementary_services.md §6A.4) — served 회선에 forward_no_reply_id(=target)·시한 5 s 를 두고 served 가 링잉만 하면(no_answer)
#   CSP 가 시한에 served leg 를 CANCEL(487 = ringing_leg_cancelled, 정상)하고 target 으로 새 B-leg(181·History-Info cause=408·전환 안내 → 링백).
#   픽스처 시나리오 — --instances 1.
id: VOLTE-ANN-FORWARD-NOREPLY
title: 무응답 전환(CFNR) → 5 s 링잉 → CANCEL → 181 → 전환 안내 → target 200
tags: [volte, announcement, cdiv]
roles:
  caller: { pool: volte_ue }
  served: { pool: volte_ue, disjoint_from: caller }
  target: { pool: volte_ue, disjoint_from: served }
flow:
  - { step: register,   who: [caller, served, target], expect: { code: 200 } }
  - { step: invite,     from: caller, to: served, media: { audio: amr-wb, rtp: explicit },
      expect: { code: 200, cdiv_181_pct: 100, cdiv_hi_pct: 100, early_media_pct: 100, early_rtp_pct: 100 } }
  - { step: no_answer,  who: [served] }
  - { step: answer,     who: [target], after_ms: 7000, expect: { code: 200, srd_ms: { p95: 16000 } } }
  - { step: media_send, who: [caller, target] }
  - { step: media_hold, seconds: 2, expect: { rtp_loss_pct: { max: 0.5 } } }
  - { step: bye,        from: caller, expect: { sdd_ms: { p95: 300 } } }
fixtures:
  cfnr: { kind: subscriber, roles: [served], forward_no_reply_to: target, no_reply_sec: 5 }
