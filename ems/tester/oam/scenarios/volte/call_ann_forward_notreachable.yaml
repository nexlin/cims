# 도달 불가 착신전환 CFNRc(TS 24.604, volte_supplementary_services.md §6A.4) — served 는 등록된 채 `unreachable` 단계로 이후 착신 INVITE 를
#   18x 없이 480 으로 즉시 거절한다(무선 이탈·NAT 바인딩 소실 단말 흉내). CSP 는 링잉 없는 480 을 도달 불가로 판정해 forward_not_reachable_id(=target)
#   로 같은 relay 위에 B-leg(181·History-Info cause=503·전환 안내 → 링백). 링잉 뒤의 480 이면 CFNR 이라 이 시나리오에서는 전환되지 않는다(구분 검증).
#   픽스처 시나리오 — --instances 1.
id: VOLTE-ANN-FORWARD-NOTREACHABLE
title: 도달불가 전환(CFNRc) → 181 → 전환 안내 → target 200
tags: [volte, announcement, cdiv]
roles:
  caller: { pool: volte_ue }
  served: { pool: volte_ue, disjoint_from: caller }
  target: { pool: volte_ue, disjoint_from: served }
flow:
  - { step: register,    who: [caller, served, target], expect: { code: 200 } }
  - { step: unreachable, who: [served] }
  - { step: invite,      from: caller, to: served, media: { audio: amr-wb, rtp: explicit },
      expect: { code: 200, cdiv_181_pct: 100, cdiv_hi_pct: 100, early_media_pct: 100, early_rtp_pct: 100 } }
  - { step: answer,      who: [target], after_ms: 7000, expect: { code: 200, srd_ms: { p95: 9000 } } }
  - { step: media_send,  who: [caller, target] }
  - { step: media_hold,  seconds: 2, expect: { rtp_loss_pct: { max: 0.5 } } }
  - { step: bye,         from: caller, expect: { sdd_ms: { p95: 300 } } }
fixtures:
  cfnrc: { kind: subscriber, roles: [served], forward_not_reachable_to: target }
