# 호 전달 권한 게이트 (volte_supplementary_services.md §6.3) — 전달자의 접속서비스가 transfer_allowed=false 면 REFER 는 403 이고 원 통화 A–B 는 유지된다.
#   전달자 역할의 신원을 그 서비스의 가입자로 두어야 뜻이 있다(검증 S3-SCN-XFER X3 는 A 의 service_ref 를 시드 서비스로 플립한 뒤 이 시나리오를 돈다).
id: VOLTE-XFER-DENIED
title: 호 전달 거절 (transfer_allowed=false → REFER 403, 원 통화 유지)
tags: [volte, xfer]
roles:
  transferor: { pool: volte_ue }
  transferee: { pool: volte_ue, disjoint_from: transferor }
  target:     { pool: volte_ue, disjoint_from: transferee }
flow:
  - { step: register,   who: [transferor, transferee, target], expect: { code: 200 } }
  - { step: invite,     from: transferor, to: transferee, media: { audio: amr-wb } }
  - { step: answer,     who: [transferee], after_ms: 500 }
  - { step: media_hold, seconds: 1 }
  - { step: refer,      from: transferor, to: target, expect: { code: 403 } }
  - { step: media_hold, seconds: "${ht}", expect: { rtp_loss_pct: { max: 1 } } }     # 원 통화 A–B 그대로
  - { step: bye,        from: transferor }
