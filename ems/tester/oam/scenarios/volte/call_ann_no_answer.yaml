# 실패 안내(announcements.md §3.1) — B-leg 가 480 Temporarily Unavailable(단말이 받지 않음·부재)로 끝나면 CSP 가 발신자에게 183+SDP 를 내고
#   `sys:ann_no_answer` 를 들려준 뒤 원래 최종 코드 480 으로 끝낸다(CSP 판정표 no_answer). 착신 UE 는 1 s 뒤 480 으로 거절한다 — 링 타임아웃(Timer B 32 s)
#   대기보다 결정적이고, CSP 안에서는 같은 B 실패 경로(OnLegFailed)를 지난다. early_media_pct/early_rtp_pct = 발신자에 183/SDP 와 안내 RTP 가 닿았는가.
id: VOLTE-ANN-NO-ANSWER
title: 착신 480(무응답) → 183 early media 안내 → 480
tags: [volte, announcement, media]
roles:
  caller: { pool: volte_ue }
  callee: { pool: volte_ue, disjoint_from: caller }
flow:
  - { step: register, who: [caller, callee], expect: { code: 200 } }
  - { step: invite,   from: caller, to: callee, media: { audio: amr-wb, rtp: explicit },
      expect: { code: 480, early_media_pct: 100, early_rtp_pct: 100 } }
  - { step: reject,   who: [callee], after_ms: 1000, payload: "480" }
