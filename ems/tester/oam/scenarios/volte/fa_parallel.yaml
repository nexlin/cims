# 대표번호 병렬 호출 (TS 24.239 Flexible Alerting, dispatch_center.md §4) — caller 가 전화 그룹 대표번호(${pilot}, 역할 아닌 번호 리터럴)로 INVITE 하면
#   CSP TAS 가 그룹원(memberB·memberC) 전원에게 포크한다. memberC 가 응답해 승자가 되고 memberB 의 링잉 leg 는 CANCEL(487 — 정상, ringing_leg_cancelled).
#   fork_alert_pct = 발신자를 뺀 UE 역할 전부에 포크 INVITE 가 도달했는가. P-Called-Party-ID 에 대표번호(pcpid_ok). 검증 S3-SCN-FA F1 — 그룹원 시드는 검증 픽스처(계획의 역할 신원).
id: VOLTE-FA-PARALLEL
title: 대표번호 병렬 호출 (포크 · 승자 · CANCEL)
tags: [volte, fa, dispatch]
roles:
  caller:  { pool: volte_ue }
  memberB: { pool: volte_ue, disjoint_from: caller }
  memberC: { pool: volte_ue, disjoint_from: memberB }
flow:
  - { step: register,   who: [caller, memberB, memberC], expect: { code: 200 } }
  - { step: invite,     from: caller, to: "${pilot}", media: { audio: amr-wb }, expect: { code: 200, fork_alert_pct: 100 } }
  - { step: answer,     who: [memberC], after_ms: 1500, expect: { code: 200 } }
  - { step: media_hold, seconds: "${ht}", expect: { rtp_loss_pct: { max: 1 } } }
  - { step: bye,        from: caller, expect: { sdd_ms: { p95: 500 } } }
