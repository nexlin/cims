# 당겨받기 — 지정 픽업 (volte_supplementary_services.md §5.2) — C 가 <code><B 번호> 를 다이얼해 B 의 링잉 호를 가져온다(피처코드 prefix 파싱).
#   to 가 있으면 워커는 payload 뒤에 to 역할의 번호를 붙여 다이얼한다. 검증 S3-SCN-PICKUP P2.
id: VOLTE-PICKUP-DIRECTED
title: 당겨받기 지정 픽업 (<code><번호>)
tags: [volte, pickup]
roles:
  caller: { pool: volte_ue }
  callee: { pool: volte_ue, disjoint_from: caller }
  picker: { pool: volte_ue, disjoint_from: callee }
flow:
  - { step: register,   who: [caller, callee, picker], expect: { code: 200 } }
  - { step: invite,     from: caller, to: callee, media: { audio: amr-wb } }
  - { step: wait,       seconds: 2 }
  - { step: pickup,     from: picker, to: callee, payload: "${pickup_code}", expect: { code: 200 } }
  - { step: media_hold, seconds: "${ht}", expect: { rtp_loss_pct: { max: 1 } } }
  - { step: bye,        from: caller }
