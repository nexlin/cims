# 당겨받기 그룹 밖 (volte_supplementary_services.md §5.1) — picker 의 pickup_group 에 링잉 호가 없으면 그룹 픽업 <code> 는 404.
#   picker 역할의 신원을 caller/callee 와 다른 pickup_group 에 둔다(검증 S3-SCN-PICKUP P4).
id: VOLTE-PICKUP-GROUP-NOCALL
title: 당겨받기 그룹 밖 그룹 픽업 → 404
tags: [volte, pickup]
roles:
  caller: { pool: volte_ue }
  callee: { pool: volte_ue, disjoint_from: caller }
  picker: { pool: volte_ue, disjoint_from: callee }
flow:
  - { step: register,   who: [caller, callee, picker], expect: { code: 200 } }
  - { step: invite,     from: caller, to: callee, media: { audio: amr-wb } }
  - { step: wait,       seconds: 2 }
  - { step: pickup,     from: picker, payload: "${pickup_code}", expect: { code: 404 } }
  - { step: bye,        from: caller }
