# MCData 그룹 FD(파일 배포 — TS 23.282 §7.4 HTTP 콘텐츠 서버 + TS 24.282 §15.1.3 FD SIGNALLING) — a 가 IdMS 토큰(scope 3gpp:mc:data_service)으로
#   CSC 콘텐츠 서버에 파일을 올리고(POST /mcdata/fd?group= — CSC 가 allow_fd·업로더 멤버십·McDataFd.MaxBytes 를 게이트) {url} 을 FILEURL 로 실은
#   FD SIGNALLING MESSAGE(Payload FILEURL + Metadata name/size/type, request-type group-fd)를 그룹에 낸다 → CSP McDataAs(allow_fd 게이트) 가 멤버에 fan-out
#   → 멤버 전원이 FILEURL 을 내려받아(GET /mcdata/fd/{id}, Bearer) Metadata size 와 대조한다(fd_download_pct).
#   신원에 IdMS 로그인(creds login/loginPw — `cims-tester creds-from-db` 가 users.login_id/passwd 를 싣는다 · source.db 도 users 행을 읽는다)이 있어야
#   하고, 대상에 role=subscriber 노드(api)가 있어야 한다. payload = 합성 크기(`256k`) 또는 워커 Media.SampleDir 의 파일 이름.
id: MCDATA-FD-GROUP
title: MCData 그룹 FD — 업로드 · FD SIGNALLING fan-out · 멤버 다운로드
tags: [mcdata, fd]
roles:
  a: { pool: ptt_ue }
  m: { pool: ptt_ue, multi: true }
flow:
  - { step: register, who: [a, m], expect: { code: 200 } }
  - { step: fd_send, from: a, payload: 256k, expect: { code: 200, fd_upload_ms: { p95: 3000 } } }
  - { step: fd_recv, who: [m], expect: { fd_delay_ms: { p95: 2000 }, fd_download_ms: { p95: 3000 }, fd_download_pct: 100 } }
