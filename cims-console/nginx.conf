# CIMS Console (Admin UI) - nginx configuration
# Serves React static build and proxies admin API calls to CSC (port 4420)
# Install: copy to /etc/nginx/sites-available/cims-console

server {
    listen 3001;
    server_name _;

    root /opt/cims/console/dist;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin API proxy → CSC admin server (port 4420)
    location /api/ {
        proxy_pass https://127.0.0.1:4420/api/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
